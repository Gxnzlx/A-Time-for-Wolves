l_english:
 agot_group_agot_tfw:0 "A Time for Wolves"

 agot_8303:0 "War of the Five Queens"
 agot_8303_desc:0 "Cersei Lannister sits upon a throne of ash, the screams of her enemies still lingering in the ruins of the Great Sept of Baelor. Crowned by fire and fear, the new Queen of the Seven Kingdoms rules through terror, her grip on King’s Landing as brittle as the wildfire that won her the throne.\n\nAcross the Narrow Sea, Daenerys Targaryen sails for Westeros at the head of a vast coalition. Backed by the Ironborn fleets of Yara Greyjoy, the vengeful spears of Dorne under the usurper Ellaria Sand, and the proud banners of the Reach led by the indomitable Olenna Tyrell, the Dragon Queen comes to reclaim her birthright.\n\nIn the North, Sansa Stark and Arya Stark maneuver to secure their family’s legacy, while the Vale’s armies stand ready under the watchful eye of Petyr Baelish. And in the Riverlands, Arya’s vengeance has left House Frey in chaos, opening the door for new claimants to rise.\n\n#bold These Queens now shape the fate of Westeros — each with armies, ambitions, and blood debts to settle. The realm stands on the edge of a new and terrible war. Who will claim the Iron Throne?#!"

 bookmark_303_cersei_lannister:0 "Queen Cersei I"
 bookmark_303_cersei_lannister_desc:0 "Cersei Lannister rules the Seven Kingdoms from a throne forged in wildfire, her power resting on the smoldering ruins of the Great Sept. Isolated by loss yet unbroken in will, she governs through fear, calculation, and the cold certainty that only she can protect House Lannister’s legacy.\n\n#bold But as enemies gather on every horizon, can the Lion Queen hold her crown or will her reign collapse under the weight of the very terror that secured it?#!"
 bookmark_303_cersei_lannister_subheading:0 "Queen of the Iron Throne"

 bookmark_303_daenerys_targaryen:0 "Queen Daenerys 'Stormborn'"
 bookmark_303_daenerys_targaryen_desc:0 "Daenerys Targaryen crosses the Narrow Sea at the head of the greatest invasion force Westeros has seen since Aegon the Conqueror, her sails black with dragons and vengeance. Surrounded by loyal allies and armed with fire, prophecy, and unshakable purpose, she comes to reclaim the throne stolen from her family.\n\n#bold Yet as she steps onto the shores of her homeland at last, will the Dragon Queen unite the realm under her banner or will the fires she brings consume everything she hopes to rule?#!"
 bookmark_303_daenerys_targaryen_subheading:0 "Queen in the East"

 bookmark_303_asha_greyjoy:0 "Queen Yara I"
 bookmark_303_asha_greyjoy_desc:0 "Yara Greyjoy, captain of the Black Wind, sails at the head of the Ironborn who refused to bend the knee to her uncle’s madness, carving her own path across the seas with defiance and precision. Fierce, loyal, and unyielding, she stakes her claim not through prophecy or conquest, but through the respect she’s earned at the helm and in battle.\n\n#bold Yet as she throws her strength behind Daenerys Targaryen’s cause, will the Ironborn finally find a future beyond reaving or will Yara’s gamble drown beneath the rising storm of queens?#!"
 bookmark_303_asha_greyjoy_subheading:0 "Queen of the Iron Islands"

 bookmark_303_olenna_redwyne:0 "Lady Olenna"
 bookmark_303_olenna_redwyne_desc:0 "Olenna Tyrell, the indomitable Queen of Thorns, stands as the last unbroken pillar of a house shattered by betrayal and wildfire. With her wit sharpened into a weapon and her grief hardened into resolve, she aligns the strength of the Reach behind the coming war, determined to see justice done for her murdered kin.\n\n#bold Yet as alliances shift and dragons cross the sea, will Olenna’s cunning be enough to secure vengeance or will House Tyrell’s final bloom wither in the storm to come?#!"
 bookmark_303_olenna_redwyne_subheading:0 "Queen of Thorns"

 bookmark_303_ellaria_sand:0 "Princess Ellaria"
 bookmark_303_ellaria_sand_desc:0 "Ellaria Sand, bastard, usurper, and now the de facto ruler of Dorne, commands its spears with a fury born of loss and a desire to reshape the realm that scorned her family. Having seized power through blood and defiance, she binds her fate to the rising Targaryen cause, seeking both retribution and a future free from the old order.\n\n#bold But as war spreads across Westeros, will Ellaria’s vengeance carve out a new legacy for Dorne or will her rebellion be swallowed by the very chaos she helped unleash?#!"
 bookmark_303_ellaria_sand_subheading:0 "Usurper Ruler of Dorne"

 agot_8305:0 "The Pack Survives"
 agot_8305_desc:0 "#italic Long Live the King!#! Brandon 'The Broken' Stark has been elected the new King of Westeros.\n\n#italic Long Live the Queen!#! Sansa Stark has been raised to the High Chair of Winterfell and the first Queen of an independent North.\n\nJon Snow has been exiled back to the far north after the crime of murdering his Queen, Daenerys Targaryen. Arya Stark has abandoned the known world forever to follow Elissa Farman and sail into the West.\n\n#bold Will the new order of an elective monarchy finally bring peace to the realm, or will ambitious eyes see weakness in the continent's Stark monarchs and once again shatter the fragile status quo?#!"

 bookmark_305_brandon_stark:0 "King Bran 'The Broken'"
 bookmark_305_brandon_stark_desc:0 "Since returning from the far reaches of the North beyond the Wall, the once sweet and excitable boy has changed. Now a quiet and solemn young man, Bran ventured south for the first time to attend the Great Council of 304 to help determine the new leader of Westeros after the death of the last Targaryen. Supported by Tyrion Lannister he was somehow able to rise uncontested to the throne of the Six Kingdoms.\n\n#bold Was King Bran elected because he truly does have the best story, or did his time beyond the wall enable his rise to power through more sinister means?#!"
 bookmark_305_brandon_stark_subheading:0 "King of Westeros"

 bookmark_305_sansa_stark:0 "Queen Sansa"
 bookmark_305_sansa_stark_desc:0 "Since escaping the clutches of King's Landing and surviving the horrors of both Ramsay Bolton and Littlefinger's schemes, Sansa Stark has grown into a formidable ruler. No longer the naive girl who once dreamed of knights and romance, she has instead forged herself into the Queen of the North, securing her homeland's independence after the Great Council of 304. Patient and unyielding, she now leads her people with a steady hand, ensuring the North will never again bow to the South.\n\n#bold Did Sansa claim her throne through her northern resilience and grit, or did she, like the other Queens she knew, learn to play the game of thrones ruthlessly but subtly?#!"
 bookmark_305_sansa_stark_subheading:0 "Queen in the North"

 bookmark_305_jon_snow:0 "Jon 'Snow'"
 bookmark_305_jon_snow_desc:0 "Once a bastard raised at Winterfell, Jon Snow's journey led him from the Wall to the throne of the North and beyond. He fought the White Walkers, led the Night's Watch, and was even declared King in the North—only to bend the knee to Daenerys Targaryen in the hopes of uniting Westeros. But after betraying and killing the Dragon Queen to save the realm, he was cast aside, exiled back to the far North. Now, he leads a band of Free Folk beyond the ruins of the Wall, leaving behind politics and duty forever.\n\n#bold Has Jon been cast aside to fade into obscurity, or has he finally found peace in true freedom?#!"
 bookmark_305_jon_snow_subheading:0 "The White Wolf"

 bookmark_305_arya_stark:0 "Arya"
 bookmark_305_arya_stark_desc:0 "No longer bound by duty, family, or vengeance, Arya Stark prepares to set sail for the unknown, leaving behind the lands of Westeros that once shaped her into a survivor, a warrior, an assassin. From the streets of King's Landing to the canals of Braavos, she has walked paths few have dared, defied death itself, and struck down the Night King. But now, with no more battles left to fight, her restless spirit drives her onward. The maps of the world end at Westeros' western shores, but Arya refuses to believe that is where the world itself ends.\n\n#bold Will Arya Stark find new lands across the Sunset Sea, or is she simply running from a home she no longer belongs to?#!"
 bookmark_305_arya_stark_subheading:0 "No-one?"

 agot_8305_2:0 "A New Order"
 agot_8305_2_desc:0 "#italic Long Live the King!#! Brandon 'The Broken' Stark has been elected the new King of Westeros.\n\n#italic Long Live the Queen!#! Sansa Stark has been raised to the High Chair of Winterfell and the first Queen of an independent North.\n\n A controversial new Lord Paramount of the Reach has replaced the Tyrells, and the unlikely heirs of ancient houses have inherited the seats of the West, the Iron Islands, the Stormlands and Dorne.\n\n#bold Will the new order of an elective monarchy finally bring peace to the realm, or will ambitious eyes see weakness in the continent's Stark monarchs and once again shatter the fragile status quo?#!"

 bookmark_305_asha_greyjoy:0 "Lady Yara"
 bookmark_305_asha_greyjoy_desc:0 "A warrior, a leader, and now the last true heir of House Greyjoy, Yara has spent her life proving she is as fierce as any Ironborn man. She fought for her brother Theon when no one else would, challenged her uncle Euron for the Salt Throne, and ultimately survived to see the end of the war that consumed Westeros. With the Iron Islands now sworn to King Bran, Yara rules as its Lady, but the ways of the Ironborn do not bend easily to diplomacy.\n\n#bold Will Yara lead the Ironborn into a new era of peace, or will the call of the Old Way and the salt-soaked sea prove too strong to resist?#!"
 bookmark_305_asha_greyjoy_subheading:0 "Lady Paramount of the Iron Isles"

 bookmark_305_tyrion_lannister:0 "Lord Tyrion"
 bookmark_305_tyrion_lannister_desc:0 "Once a scorned outcast in his own family, Tyrion Lannister has played the game of thrones longer than most—sometimes as a master, sometimes as a pawn. He has advised kings and queens, betrayed rulers, and barely escaped death more times than he can count. Now, as Hand of the King to Bran the Broken, he holds the fate of the realm in his hands, tasked with rebuilding a shattered kingdom alongside a council of unlikely allies. But power is a dangerous thing, and even the wisest hands can still make costly mistakes.\n\n#bold Can Tyrion finally bring lasting peace to Westeros, or will his past failures and the weight of responsibility crush him once more?#!"
 bookmark_305_tyrion_lannister_subheading:0 "Warden of the West"

 bookmark_305_bronn_blackwater:0 "Lord Bronn"
 bookmark_305_bronn_blackwater_desc:0 "From sellsword to lord, from lord to Master of Coin—Bronn's rise through the ranks of Westerosi nobility has been anything but traditional. Once content to fight for gold and drink himself into oblivion, he now finds himself in charge of the realm’s finances, despite having absolutely no qualifications beyond an uncanny knack for survival. With Highgarden in his pocket and a seat on the Small Council, Bronn has finally gotten everything he ever wanted… but managing the kingdom’s coin is a far cry from swinging a sword.\n\n#bold Will Bronn prove himself a shrewd steward of the realm’s wealth, or will he drain the treasury faster than the King's Hand drains a wine cask?#!"
 bookmark_305_bronn_blackwater_subheading:0 "Lord Paramount of the Reach"

 bookmark_305_gendry_baratheon:0 "Lord Gendry"
 bookmark_305_gendry_baratheon_desc:0 "Once just a blacksmith’s apprentice in King’s Landing, Gendry has come a long way from the forge. The bastard son of King Robert Baratheon, he fought against the dead at Winterfell, survived years on the run, and was unexpectedly legitimized as Lord of Storm’s End by Queen Daenerys. But ruling a noble house is a far cry from swinging a hammer, and Gendry now faces a challenge unlike any battlefield—navigating the treacherous world of politics and power.\n\n#bold Will Gendry prove himself worthy of the Baratheon name, or will the storms of the Stormlands wash away this upstart lord?#!"
 bookmark_305_gendry_baratheon_subheading:0 "Lord Paramount of the Stormlands"

 bookmark_305_edmure_tully:0 "Lord Edmure"
 bookmark_305_edmure_tully_desc:0 "Once the proud Lord of Riverrun, Edmure Tully spent much of the war bound in chains—first as a hostage of the Freys, then as a prisoner of the Lannisters. With his house nearly destroyed and his dignity battered, he was finally freed after the wars had ended, only to fumble a bid for the throne in front of the assembled lords of Westeros. Now restored as Lord of the Trident, Edmure faces the challenge of rebuilding his fractured lands and proving that the Tully name still carries weight.\n\n#bold Will Edmure rise to the occasion as a true ruler of the Riverlands, or will he forever be remembered as the lord who couldn't quite hold his own?#!"
 bookmark_305_edmure_tully_subheading:0 "Lord Paramount of the Riverlands"

 bookmark_305_robert_arryn:0 "Lord Robert"
 bookmark_305_robert_arryn_desc:0 "Once a sickly, spoiled boy clinging to his mother’s skirts, Sweetrobin Arryn—now formally known as Lord Robert—has grown into his role as ruler of the Vale. Though his health has improved and his mind has matured, the sheltered heir still lacks experience in war, politics, and leadership. With the Vale standing strong while much of Westeros lies in ruin, many wonder if its young lord has what it takes to rule, or if his advisors will continue to do the thinking for him.\n\n#bold Will Robert Arryn prove himself a worthy Warden of the East, or will he remain little more than a pampered falcon in a gilded cage?#!"
 bookmark_305_robert_arryn_subheading:0 "Lord Paramount of the Vale"

 bookmark_305_manfrey_martell:0 "Prince Manfrey"
 bookmark_305_manfrey_martell_desc:0 "Dorne has always stood apart from the rest of Westeros, and under Prince Manfrey Martell, that divide has only grown. Unlike his predecessors, Manfrey has embraced the old Rhoynish ways, rejecting the Faith of the Seven in favor of the gods his ancestors once followed across the Narrow Sea. With the Seven Kingdoms now under King Bran’s rule, Dorne remains independent in all but name, its prince charting his own course through an uncertain new era.\n\n#bold Will Prince Manfrey restore the lost traditions of the Rhoynar and make Dorne truly independent, or will his unorthodox beliefs and the pressures of ruling pull him under the sands?#!"
 bookmark_305_manfrey_martell_subheading:0 "Prince of Dorne"

 bookmark_305_elyas_scales:0 "Lord Elyas"
 bookmark_305_elyas_scales_desc:0 "#bold The Queen is dead.#! \n\nMere months ago the Last Dragon was murdered by the bastard son of the Usurper's dog. But some say that death isn't so final these days... \n\nThe White Walkers from the frozen north brought back legions of the dead, The Red God is said to have brought back Lord Beric Dondarrion from the beyond, and some rumours claim the Queenslayer himself was brought back by Melisandre of Asshai. \n\n#bold Long Live the Queen...#!"
 bookmark_305_elyas_scales_subheading:0 "Lord of the Scales"

 bookmark_305_aurane_waters:0 "Pirate King Aurane 'Waters'"
 bookmark_305_aurane_waters_desc:0 "Former Queen Cersei Lannister was foolish enough to entrust the Royal Fleets to her new Lord Admiral, the bastard of Driftmark Aurane Waters. On the first opportunity the Admiral vanished with the fleet, and just a few weeks later rumours began to arrive in the capital of a new Pirate King in the Stepstones styling himself 'The Lord of the Waters'. With a fleet of royal galleys at his command, Aurane has quickly carved out a dominion in the treacherous waters of the Stepstones. He has not only become a threat to the merchants of Essos but also to the great houses of the Narrow Sea, including his own kin, House Velaryon, who have long prided themselves as the masters of the tides. \n\n#bold Will Aurane Waters find allies among the disgruntled lords of the Narrow Sea, or will the new King's peace be drowned by the tide of his ambition?#!"
 bookmark_305_aurane_waters_subheading:0 "Pirate King of the Stepstones"

 bookmark_305_monterys_velaryon:0 "Lord Monterys"
 bookmark_305_monterys_velaryon_desc:0 "The proud House Velaryon of Driftmark has weathered centuries of storm and tide, often serving as loyal allies to House Targaryen. But with the dragons gone and the seas now roamed by pirates, Lord Monterys Velaryon inherits his seat at a time of uncertainty. The Stepstones are restless, Aurane Waters claims dominion as a pirate king, and the once-great Velaryon fleet is diminished. Young Monterys must decide whether to restore his house’s ancient dominance over the seas or fade into irrelevance among the lords of Westeros.\n\n#bold Will Monterys rise to reclaim the Velaryons’ legacy as masters of the Narrow Sea, or will Driftmark sink beneath the waves of history?#!"
 bookmark_305_monterys_velaryon_subheading:0 "Lord of the Tides"

 bookmark_305_davos_seaworth:0 "Lord Davos"
 bookmark_305_davos_seaworth_desc:0 "From smuggler to knight, from knight to lord, Davos Seaworth has lived a life few could imagine. Once called the Onion Knight for the cargo that saved a starving Stannis Baratheon, he became a trusted advisor and, against all odds, a voice of reason in a world of ambition and betrayal. Now, after the wars that shook Westeros, Davos holds the title of Lord of the Drench and serves as one of the realm’s most steadfast counselors. But titles mean little to the man who once risked everything for honor and loyalty.\n\n#bold Will Lord Davos find a place in the new order as a true statesman, or will his past as a smuggler forever keep him in the shadows of greater lords?#!"
 bookmark_305_davos_seaworth_subheading:0 "The Onion Knight"

 bookmark_315_sansa_stark:0 "Queen Sansa"
 bookmark_315_sansa_stark_desc:0 "It's been ten long years since Sansa Stark was crowned Queen in the North. \n\nIn the South the world has changed, the Anarchy in the Reach has lead to the greatest redrawing of borders since Aegon's Conquest and a new legal framework for the Kingdom. King Brandon has moved the capital out of King's Landing and into Harrenhal, a wave of religious turmoil has brought mas conversions in the Riverlands and radicalisation in the Vale. \n\n#bold But in the North, little has changed...#!"

 bookmark_366_joffrey_lannister:0 "King Joffrey 'The Silver Lion'"
 bookmark_366_joffrey_lannister_desc:0 "It has been seven weeks since the death of King Oscar 'Surehand' Tully, and seven weeks of the first fiercly contested election in Westerosi history. The result, a surprise victory for Joffrey Lannister, a cousin of the Lord of the West. Jaime Lannister, the runner up, contests the results of the election and has retreated back to Casterly Rock. No formal declaration of independence has been issued but the Lords of the Western Alliance are not fulfilling their feudal obligations to the new King. \n\n#bold Will the new King be able to meet the moment and bring his cousin back into the fold? Or is civil war once again inevitable in Westeros?#!"

 agot_group_agot_tfw310:0 "The New Pact"
 agot_8310:0 "A Realm Reforged"
 agot_8310_desc:0 "#italic The Pact is signed.#! At dawn on the first day of 310 AC, the lords and ladies of Westeros ratified the New Pact at a Great Council in Harrenhal, binding the realm to an elective monarchy and reshaping its ancient feudal order.\n\nThe Reach lies divided after plague and rebellion, its great house extinguished. The Riverlands mourn Lord Edmure, now ruled by his young son. The Stormlands test the strength of their upjumped bastard lord, while Dorne follows its own path under Prince Manfrey. Across the Narrow Sea, whispers of dragons, pirates, and pretenders still stir.\n\n#bold Will the New Pact bring Westeros an age of peace and compromise, or will old ambitions and fresh wounds tear the realm apart once more?#!"

 bookmark_310_brandon_stark:0 "King Brandon 'the Broken'"

 bookmark_310_brandon_stark_desc:0 "The first King of Westeros to be elected rather than born to the crown, King Bran rules from his new seat at Harrenhal. His reign has begun with great change and turmoil, as the realm recovers a devastating plague and rebellion in the Reach, and a wave of religious upheaval that threatens to tear the faith of the Seven apart. King Bran has already made his mark on history by moving the capital and overseeing the establishment of 'The New Pact', a new legal framework for Westeros. Yet, in a realm of traditionalists, many question the wisdom of having a tree worshiping northerner as monarch, for he does not think, act or speak as a King\n\n#bold Will Bran’s knowledge of the past and future secure the prosperity of his new kingdom, or will his detachment from the world of men be its ultimate undoing?#!"

 bookmark_310_manfrey_martell:0 "Prince Manfrey Martell"

 bookmark_310_manfrey_martell_desc:0 "The new order has come to Westeros, but not to Dorne. For centuries, the Martells have held the sun and spear as their own, and the Council of 305 AC, which saw the election of a new King and the reordering of the realm, was little concern of theirs, Dorne retains a law unto itself. Prince Manfrey Martell now rules from Sunspear, but with an ever-changing Westeros to his north, Dorne stands alone.\n\n#bold Will Prince Manfrey continue to uphold Dorne's ancient defiance and autonomy, or will the weight of the new world order eventually force him to bend the knee?#!"

 bookmark_310_gendry_baratheon:0 "Lord Gendry Baratheon"

 bookmark_310_gendry_baratheon_desc:0 "From a bastard's life in the back alleys of King's Landing to a trueborn lord, Gendry Baratheon has lived a life of staggering change. As the last living male heir of King Robert, he was legitimized and granted the seat of Storm's End. His rise, however, has not been without its challenges. A rebellion led by the Fells threatened to tear the Stormlands apart, and Gendry was forced to seek the King's aid. In putting down the rebellion, the King has secured his position, but Gendry now finds himself in a position of great debt to the new monarch.\n\n#bold Will Gendry's loyalty to the crown be unwavering, or will he seek to repay his debt and forge a new path for House Baratheon?#!"

 bookmark_310_talla_tarly:0 "Lady Talla Tarly"

 bookmark_310_talla_tarly_desc:0 "For centuries, the Marches of the Reach have been the first line of defence against the Dornish, and no house has bled more for their land than the Tarlys. With the death of Lord Randyll Tarly and the later Anarchy in the Reach, the new King saw an opportunity to reward loyalty. As such, the Marches have been made their own Lord Paramountcy, with the King proposing the daughter of Lord Randyll, Talla Tarly, to lead them.\n\n#bold Will Talla Tarly, as the King's chosen, be able to unite the divided houses of the Marches and prove herself a worthy leader in this new age of uncertainty?#!"

 bookmark_310_leyton_hightower:0 "Lord Leyton Hightower"

 bookmark_310_leyton_hightower_desc:0 "As the oldest and most revered house in the Reach, the Hightowers have long commanded influence beyond their formal title. With the Tyrells toppled and the King's new decree, Oldtown is now the heart of its own independent Lord Paramountcy. The Hightowers, long known for their deep connection to the Citadel and the Faith, now find themselves at the pinnacle of power.\n\n#bold Will they use their newfound authority to shape the political and religious future of Westeros, or will their ambition bring them into conflict with their new neighbours?#!"

 bookmark_310_mathis_rowan:0 "Lord Mathis Rowan"

 bookmark_310_mathis_rowan_desc:0 "For centuries, the Rowans have been loyal vassals of the Tyrells, and their seat at Goldengrove has stood as a symbol of the Reach's wealth and beauty. With the great houses of the Reach in disarray following the Anarchy, King Bran has seen fit to carve the old realm into three separate kingdoms. House Rowan now stands as the Lord Paramount of the Goldengroves, with Lord Mathis Rowan at the head of a fledgling kingdom.\n\n#bold Will he be able to navigate the political intrigue of the Reach and forge a new dynasty, or will the Anarchy be his undoing?#!"

 bookmark_310_amanda_peake:0 "Lady Amanda Peake"

 bookmark_310_amanda_peake_desc:0 "At just two years of age, Amanda Peake is a child in a man's world, a pawn in the deadly game of thrones that has consumed the Reach. Her father, the ambitious Lord Titus Peake, sought to use her as a symbol of his claim to the Lord Paramountcy, but his aspirations were as short-lived as the plague that swept through Highgarden. With the Peake forces decimated and their power broken, young Amanda is all that remains of her house's fleeting grasp on power.\n\n#bold Will her house be able to recover from its devastating losses and find a new place in the three new Kingdoms of the Reach, or will the Peakes, once a great house, be forever lost to the shadows of their ambition?#!"


 bookmark_310_alkeyne_florent:0 "Lord Alkeyne Florent"

 bookmark_310_alkeyne_florent_desc:0 "With the Anarchy having torn the Reach apart, House Florent, a house with a claim to Highgarden itself, has found its fortunes diminished. The new Lord Paramounts of the Reach were chosen for their loyalty, not their ancient bloodlines, and as a result, House Florent was overlooked. With the lands now divided into three separate kingdoms, Lord Alkeyne Florent is a powerful lord in the Oldtown, but he is a vassal to the newly elevated House Hightower. A proud house with a claim to the throne of the Reach, the Florents do not suffer lesser lords ruling over them lightly.\n\n#bold Will Alkeyne Florent remain a loyal vassal to his new liege, or will he use his house's ancient claim to restore the Florents' former glory and reclaim the rule of the Reach?#!"

 bookmark_310_anders_yronwood:0 "Lord Anders Yronwood"

 bookmark_310_anders_yronwood_desc:0 "While the rest of the great houses of Westeros were in turmoil following the death of Daenerys Targaryen, Dorne stood apart. But a Prince of Dorne is only as powerful as the support he commands from his vassals. Among the most powerful of these is House Yronwood, whose seat lies at the very border with the Stormlands. Lord Anders Yronwood is the master of a house with a long and proud history, a history marked by both loyalty to the Martells and bitter rivalry. With the new King in the North and a legitimized Baratheon ruling the Stormlands, the ancient feuds of Dorne are once again at risk of flaring up.\n\n#bold Will Anders Yronwood remain a loyal vassal to his Prince, or will he see an opportunity in the new order to advance his house's interests and challenge the power of Sunspear?#!"


