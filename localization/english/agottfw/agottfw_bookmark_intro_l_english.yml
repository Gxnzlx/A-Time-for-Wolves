l_english:
 atfw_bookmark_intro.supporters.t:0 "The Dragon's Return"
 atfw_bookmark_intro.enemies.t:0 "The Mad King's Daughter"

 # Daenerys Targaryen 
 atfw_bookmark_intro.0001.desc:0 "All my life, I have heard of Westeros as the home that was taken from me before I was even old enough to remember it. Now, after years of exile, I have finally returned. Dragonstone, the fortress where I was born and the ancient seat of my ancestors, is once again in Targaryen hands. The three-headed dragon flies above its battlements once more, and my three dragons soar through its skies.\n\nI have not returned alone. My Unsullied and my Dothraki have crossed the sea with me, while Dorne and the Reach have joined their cause to mine. Across the bay, Cersei Lannister sits upon the Iron Throne that is mine by right of blood.\n\nI have spent too long running, gathering strength, and dreaming of this moment. I am no longer the little girl who fled Dragonstone during a storm. I have returned as a queen, and this time I will not run.\n\n#bold I have returned to Westeros to reclaim what was stolen from my family.#!"
 atfw_bookmark_intro.0001.a:0 "I will take what is mine with fire and blood."

 # Olenna Tyrell
 atfw_bookmark_intro.0002.desc:0 "My house has lost almost everything. Mace, Margaery, and Loras died when Cersei Lannister reduced the Great Sept of Baelor to ashes, and with them died much of the future I had built for House Tyrell. There are no more marriages to arrange, no more courtly intrigues that can restore what was taken from me.\n\nBut I still have the Reach. I still have its armies, its wealth, and enough time left to settle my accounts before I join my family.\n\nDaenerys Targaryen has returned to Westeros and established herself on Dragonstone. She has dragons, armies, and a claim to the Iron Throne. I have something far simpler: a debt to collect. So long as Cersei sits upon that throne, I will not rest knowing that my family remains unavenged.\n\n#bold My house may have no future, but I can still avenge its past.#!"
 atfw_bookmark_intro.0002.a:0 "Let Cersei remember what she did."

 # Ellaria Sand
 atfw_bookmark_intro.0003.desc:0 "Elia. Her children. Oberyn. Too many names, too many dead, and too many years spent watching the Lannisters escape the consequences of their deeds. Now Cersei Lannister sits upon the Iron Throne, and at last I have the chance to make her house pay for all the blood it has spilled.\n\nDaenerys Targaryen has returned to Westeros and established her court on Dragonstone. She too has scores to settle with those who destroyed her family, and her dragons and armies can turn her claim into something more than words.\n\nThe spears of Dorne will join the dragon. I will not do it for love of the Iron Throne, nor out of loyalty to a queen I scarcely know. I will do it because our enemies are the same, and because the time has come for the Lannisters to answer for what they have done.\n\n#bold They have taken too much from us. It is time to collect what is owed.#!"
 atfw_bookmark_intro.0003.a:0 "For Oberyn. For Dorne."

 # Yara Greyjoy
 atfw_bookmark_intro.0004.desc:0 "Euron took the Iron Islands from me, had himself crowned king, and forced me to flee the home I meant to rule. Now he has taken the Iron Fleet to Cersei Lannister and offers her his ships in exchange for a crown he should never have worn.\n\nBut I did not flee the islands to spend the rest of my days in exile. Daenerys Targaryen needs ships and allies to conquer Westeros; I need a queen powerful enough to help me overthrow Euron. Our agreement is simple: I will fight for her crown, and she will recognize my right to the Iron Islands.\n\nMy uncle has the Iron Fleet and believes himself untouchable. Soon he will learn that I am still here, and that I have no intention of letting him keep what he stole from me.\n\n#bold Euron took the Iron Islands from me. I will return to take them back.#!"
 atfw_bookmark_intro.0004.a:0 "I will take back the Iron Islands."

 # Cersei Lannister
 atfw_bookmark_intro.0005.desc:0 "My enemies thought they could humiliate me. The Tyrells, the High Sparrow, and his fanatics filled King's Landing convinced that they could force me to bow my head. Now they are all ashes beneath the ruins of the Great Sept of Baelor, and I am the one who sits upon the Iron Throne.\n\nAnd now comes another. Daenerys Targaryen, the Mad King's daughter, has landed on Dragonstone to claim my crown. They say she has brought with her a horde of Dothraki savages, an army of slave eunuchs, and even three great dragons that obey her commands. Dorne and what remains of the Tyrells have scurried behind her, convinced that a Targaryen girl and a few monsters from old tales will be enough to drive me from my throne.\n\nLet them believe it.\n\nRobert is dead. Ned Stark is dead. The High Sparrow is dead. Margaery and her proud family burned together when I decided I had endured enough. One by one, everyone who tried to destroy me ended up dead while I remained standing.\n\n#bold If the Mad King's daughter believes she will be any different, she will soon learn the same lesson as all the others.#!"
 atfw_bookmark_intro.0005.a:0 "Let her come."

 # Jon Snow
 atfw_bookmark_intro.jon.t:0 "The Battle Is Over"
 atfw_bookmark_intro.0006.desc:0 "Winterfell belongs to the Starks once more. Ramsay Bolton is dead, his men lie defeated, and the direwolf flies again above the walls of the home I thought lost forever. After everything that has happened, Sansa and I have finally come home.\n\nBut taking back Winterfell was never the end of my war. I saw the Night King at Hardhome. I saw what he can do with the dead, and I know that while the lords of Westeros continue fighting their wars over castles and crowns, an army that knows neither hunger, fear, nor exhaustion marches toward the Wall.\n\nThe North, however, is exhausted and divided. Some houses fought beside us against the Boltons; others stood aside, and some gave their men to Ramsay. Now they must all decide where they will stand in what is to come.\n\nI must gather the banners at Winterfell. There are old grievances to settle, oaths to renew, and a far greater war for which we must prepare.\n\n#bold I have reclaimed my home. Now I must prepare the North for the real war.#!"
 atfw_bookmark_intro.0006.a:0 "I will summon all the banners to Winterfell."