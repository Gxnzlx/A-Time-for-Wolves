l_english:
 nick_the_incredibly_old_one: "The Incredibly Old One"
 nick_the_big_fat_one: "The Big Fat One"

 nick_redwolf: "Redwolf"

 nick_halfmaester: "Halfmaester"
 nick_halfmaester_desc: "Haldon, called Halfmaester, studied at the Citadel of Oldtown, but did not earn enough links to become a maester."

 nick_griff: "Griff"
 nick_griff_desc: "Lord Jon Connington, Hand of the True King, spent much of his exile living under the identity of the sellsword Griff. During those years he raised and protected the young son of his dearest friend. Jon failed the father, but he will not fail the son."

 nick_griff_victorius: "Lord Griff"
 nick_griff_victorius_desc: "Lord Jon Connington, restored Lord of Griffin's Roost and Hand of the King, spent much of his exile living under the identity of the sellsword Griff. During those years he raised and protected the young man he believed to be the son of his dearest friend. When the truth finally came to light, the exiled lord was forced to make a choice. In the end, he chose to remain with his ward. For black or red, a dragon is still a dragon."

 nick_duck: "Duck"
 nick_duck_desc: "Ser Rolly Duckfield, known as 'Duck', was a smith of humble birth in the service of the Golden Company who dreamed of the day he would be made a knight. When the sellsword known as Griff asked him to train his son, Rolly carried out his duty faithfully. In time, the smith became a knight, and his pupil became a dragon."

 nick_duck_victorius: "Duck"
 nick_duck_victorius_desc: "Ser Rolly Duckfield, known as 'Duck', was a smith of humble birth in the service of the Golden Company who dreamed of the day he would be made a knight. When the sellsword known as Griff asked him to train his son, Rolly carried out his duty faithfully. In time, the smith became a knight, and his pupil became a dragon. Now he wears the white of the Kingsguard and serves his king with the same loyalty that carried him there."

 nick_aegon_griff: "Young Griff"
 nick_aegon_griff_desc: "Aegon Targaryen, son of Prince Rhaegar and Elia of Dorne, was raised in exile under the care of the sellsword Griff, an identity behind which Lord Jon Connington, his father's closest friend, concealed himself. Prepared from childhood to rule, he grew up among the smallfolk. In addition to weapons training, he was instructed in history, law, and the mysteries of the Faith, for he was taught that a king does not rule by right, but by duty."

 nick_aegon_dragon: "the Dragon"
 nick_aegon_dragon_desc: "Aegon, who all his life believed himself to be the son of Prince Rhaegar and Elia of Dorne, was raised in exile by Lord Jon Connington. Prepared from childhood to rule, he learned that a king does not rule by right, but by duty. When the truth of his origin was finally revealed, Aegon Blackfyre gathered his forces and his allies and led the exiles back to Westeros, for black or red, a dragon is still a dragon."