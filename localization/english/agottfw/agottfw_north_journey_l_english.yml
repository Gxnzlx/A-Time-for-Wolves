l_english:
 atfw_north_journey.0001.t:0 "The road we will share"
 atfw_north_journey.0001.desc:0 "We have promised to face the dead together. Jon proposes sailing with you to White Harbor and continuing overland to Winterfell. Arriving beside him may do more to win northern trust than any banner. You choose the ship over making the journey alone upon Drogon."
 atfw_north_journey.0001.a:0 "We will go north together."
 atfw_north_journey.0002.t:0 "Together to Winterfell"
 atfw_north_journey.0002.desc:0 "Daenerys agrees to sail with you. At White Harbor you will take the road north, and your people will see the queen beside the man who asked for her help. For the first time, returning home means bringing someone whose place in your life you cannot yet name."
 atfw_north_journey.0002.a:0 "Then let us make ready."
 atfw_north_journey.0003.t:0 "Ready to sail"
 atfw_north_journey.0003.desc:0 "The northern journey is agreed. You and Jon will depart from Dragonstone in the same travelling party, bound for Winterfell. Prepare the route. If either of you is occupied by another journey, the decision to resume this expedition will remain available when you are both free."
 atfw_north_journey.0003.a:0 "Prepare our route."
 atfw_north_journey.0004.t:0 "White Harbor"
 atfw_north_journey.0004.desc:0 "The ship reaches White Harbor. What began between you and Jon aboard it now travels with you into a land that knows little of you beyond your family name. Winterfell still lies inland. Together, you prepare to take the road to his home."
 atfw_north_journey.0004.a:0 "Now, the road to Winterfell."
 atfw_north_journey.0006.t:0 "A queen in the North"
 atfw_north_journey.0006.desc:0 "Winterfell rises ahead. Jon has returned to his family, and you have come with him, your soldiers and dragons drawing wary looks from the northern crowd. Sansa receives you with formal courtesy. You recognize the distance beneath it. Being welcome at Jon's side is not the same as being accepted by his people."
 atfw_north_journey.0006.a:0 "We have come to fight beside you."
 atfw_north_journey.0007.t:0 "Guests, soldiers and dragons"
 atfw_north_journey.0007.desc:0 "Jon is home, but he has not returned alone. Daenerys stands beside him while an army gathers beyond your walls. You offer the welcome your house owes a guest. Behind that courtesy lie questions about food, command and the future of the North. Those questions will have to be answered, even if your brother would rather embrace his family today."
 atfw_north_journey.0007.a:0 "Winterfell receives you."
 atfw_resume_north_journey:0 "Continue the journey north"
 atfw_resume_north_journey_desc:0 "Continue with Jon to Winterfell from your current location."
 atfw_resume_north_journey_tooltip:0 "Resume the shared journey."
 atfw_resume_north_journey_confirm:0 "Depart for Winterfell"
 atfw_resume_winterfell_story:0 "Continue the Winterfell story"
 atfw_resume_winterfell_story_desc:0 "Resume the next pending encounter between Jon and Daenerys. Use this if an older save has stalled; answer any open story events before continuing."
 atfw_resume_winterfell_story_tooltip:0 "Resume the next pending encounter."
 atfw_resume_winterfell_story_confirm:0 "Continue"
