 decision_in_major_port: "You are in a major port town"
 sail_into_west_decision: "Sail into the West"
 sail_into_west_decision_desc: "Embark on a grand voyage into the sunset to discover what lies west of Westeros."
 sail_into_west_decision_effect: "You begin preperations to board a great ship and set course for the unknown."
 sail_into_west_decision_tooltip: "Set sail into the Sunset Sea"
 sail_into_west_decision_confirm: "Start the preperations!"
 bookmark.tfw.t: "Preparing the Great Voyage"
 bookmark.tfw.desc_intro: "Centuries ago Elissa Farman stole a clutch of dragon eggs from Dragonstone to fund the construction of a great ship. Her plan, a great voyage into the West. \n\nNo-one knows what happened to her except that she never returned. Will you be the first to find out?"
 bookmark.tfw.a: "Time to find a ship!"
 bookmark.tfw.a.tt: "You search the port for a tall ship and a brave crew."
 bookmark.tfw.b: "Not yet..."
 bookmark.tfw.b.tt: "Your family will be relieved!"
 bookmark.tfw.desc_2: "It's taken a few days, but you have finally managed to find yourself a Captain willing to make the journey. Should all go as expected, the ship leaves harbour tomorrow. \n\nThis is your last chance to back out..."
 bookmark.tfw.c: "Let's see whats out there!"
 bookmark.tfw.c.tt: "The ship sails west."
 bookmark.tfw.d: "Not today..."
 bookmark.tfw.d.tt: "You abandon your plans and remain on dry land."
 bookmark.tfw.desc_3: "You gaze out towards the horizon and realise that today somehting is different... \n\nYou've lost sight of land! \n\nFew have ever sailed this far west already, but your Great Voyage is only just begining..."
 bookmark.tfw.e: "On into the sunset!"
 bookmark.tfw.e.tt: "You vanish beyond the sea, never to be seen again."

 res_dany_decision: "Ressurect the True Queen"
 res_dany_decision_desc: "Work with your Red Priest to breath life back into the corpse of Daenerys Targaryen, the last legitimate Queen of Westeros. \n\nAny request made of the Lord of Light is more likely to be fulfilled with a sacrifice. King's blood demonstated it's power during the War of the Five Kings."
 res_dany_decision_effect_0: "Your chances of success depend upon your devotion to R'hllor, the skill of your Red Priest and the value of your sacrifice."
 res_dany_decision_tooltip: "Attempt to ressurect Daenerys Targaryen."
 res_dany_decision_confirm: "Light the night fires!"
 res_dany_cooldown_text: "You have #bold NOT#! taken this decision in the last year"

 tfw_look_into_flames.0001.prisoner: "King's blood holds great power!"
 tfw_look_into_flames.0001.prisoner.tt: "This will certainly gain me the favour of the Lord of Light!"
 tfw_look_into_flames.0001.peasants: "A sacrifice of smallfolk will sufice."
 tfw_look_into_flames.0001.peasants.tt: "This will probably be enough for R'hllor."
 tfw_look_into_flames.0001.false_idols: "Burn the false gods."
 tfw_look_into_flames.0001.false_idols.tt: "Burning false idols will surely gain me the Lord's favour..."
 tfw_look_into_flames.0001.a: "I will make no offering but my prayers."
 tfw_look_into_flames.0001.a.tt: "The Red God usually demands sacrifice..."
 tfw_look_into_flames.0001.b: "The time is not right."

 agot_tfw_dany.0001.t: "Return of the Queen?"
 agot_tfw_dany.0001.desc: "It is said R'hllor speaks to his chosen through the blessed fire, in a language of ash and cinders — a language hard to grasp even for his priests. I observe the night pyres and wonder, will my prayers be answered? My Priest suggests an offering would surely gain me the favor of The Lord of Light after all, only death can pay for life. Will even King's blood be enough to pay for the blood of the Dragon?"
 agot_tfw_dany.0002.t: "The Princess that was Promised"
 agot_tfw_dany.0002.desc: "The screams of the sacrifice stopped hours ago, and now the flames are begining to dwindle. Nothing has happened, though the Queen's corpse remains unharmed. Was our work not enough to please the Lord of Light? \n\nThere's only one sacrifice left to make. Just as Nissa Nissa willingly gave up her life to forge Lightbrnger, you walk into the flames and give your life to Azor Ahai reborn."
 agot_tfw_dany.0002.a: "AAAAAAAAGGGGGHHHHHHHH!"
 agot_tfw_dany.0002.a.tt: "#bold You will continue to play as Daenerys Targaryen #!#"
 agot_tfw_dany.0002.b: "Father! NOOOO!"
 agot_tfw_dany.0002.b.tt: "You will #bold NOT #!# change to Daenerys Targaryen, but continue as your characters heir"
 agot_tfw_dany.0003.t: "Failure..."
 agot_tfw_dany.0003.desc: "The screams of the sacrifice stopped hours ago, and now the flames are begining to dwindle. Nothing has happened, though the Queen's corpse remains unharmed."
 tfw_look_into_flames.0003.a: "Is it even possible?"

