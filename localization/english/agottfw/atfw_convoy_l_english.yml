 atfw_convoy.0001.t:0 "Fire on the Roseroad"
 atfw_convoy.0001.desc:0 "Highgarden has fallen and Olenna is dead. The following day, Drogon and the Dothraki catch the convoy carrying the plunder of the Reach. Wagons burn and Jaime's host breaks beneath the flames.\n\nRandyll Tarly refuses to kneel. Dickon stands beside him. The son will face the fire first; the father will follow."
 atfw_convoy.0001.a:0 "Dracarys."
 atfw_convoy.0001.tt:0 "The scenario host is destroyed. Dickon Tarly dies by dragonfire, followed by Randyll Tarly."
