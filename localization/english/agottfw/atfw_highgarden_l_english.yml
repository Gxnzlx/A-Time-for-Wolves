l_english:
 atfw_highgarden.0002.t:0 "The Fall of Highgarden"
 atfw_highgarden.0002.desc:0 "Highgarden has fallen to the Lannister army. Olenna remained in the fortress and has been executed; the unprotected Tyrells were not spared either.\n\nLeo Tyrell and the survivors have formed an exile camp. Randyll Tarly receives Highgarden and the Reach under Cersei."
 atfw_highgarden.0002.fled:0 "Highgarden has been abandoned and fallen into Lannister hands. Olenna escaped with the protected Tyrells and now leads the Roses in Exile.\n\nRandyll Tarly receives Highgarden and the Reach under Cersei. We have lost a fortress, but Olenna lives."
 atfw_highgarden.0002.a:0 "The lions will answer for this."
 atfw_highgarden.0003.t:0 "A Month at Dragonstone"
 atfw_highgarden.0003.desc:0 "A month has passed since I reached Dragonstone. The southern war still occupies this court, but I cannot keep waiting.\n\nI must speak with Daenerys. The dead will grant the North no truce."
 atfw_highgarden.0003.a:0 "It is time to speak with the queen."
 atfw_highgarden.0004.t:0 "The Siege of Highgarden"
 atfw_highgarden.0004.desc:0 "Thirty thousand Lannister soldiers have arrived at Highgarden. They ready their siege engines and surround our defenses.\n\nI can still escape with the family members I have chosen to protect. I would abandon my lands to lead an adventurer camp at Sunspear.\n\nIf I stay, Leo will lead the survivors into exile while I defend the fortress. If the lions take it, they will execute me."
 atfw_highgarden.0004.stay:0 "I will stay. Leo will bring our family to safety."
 atfw_highgarden.0004.flee:0 "We will flee together. This is not our end."
 atfw_highgarden.0005.t:0 "The Fall of Highgarden"
 atfw_highgarden.0005.desc:0 "The army has conquered Highgarden. Olenna remained and has paid with her life, along with the Tyrells who were not spared.\n\nLeo and the survivors have formed an exile camp. Randyll Tarly receives Highgarden and the Reach in my name."
 atfw_highgarden.0005.fled:0 "Olenna abandoned Highgarden and fled with the protected Tyrells. They now live in an adventurer camp, far from the lands they have lost.\n\nRandyll Tarly receives Highgarden and the Reach in my name. The old thorn escaped, but her fortress is ours."
 atfw_highgarden.0005.a:0 "Hear me roar."
 atfw_highgarden.0007.t:0 "The Last Rose of Highgarden"
 atfw_highgarden.0007.desc:0 "The defenses have failed. The Lannisters have conquered Highgarden, and my resistance has reached its end.\n\nLeo and the protected Tyrells are already far away. My choice gave them a chance, but there will be no escape for me. The victors have pronounced my sentence."
 atfw_highgarden.0007.a:0 "They will not hear me beg."
 atfw_highgarden.stay_tt:0 "You remain in Highgarden. Leo Tyrell will lead the eleven protected Tyrells in an adventurer camp. This chain only executes you if the Lannisters conquer the fortress."
 atfw_highgarden.flee_tt:0 "You abandon your territorial titles and form the Roses in Exile adventurer camp with the eleven protected Tyrells. Highgarden falls and Randyll receives the Reach."
 atfw_highgarden.death_tt:0 "Olenna will be executed. Her game may end if she has no playable succession."
 atfw_highgarden_exiles_title:0 "The Roses in Exile"
 atfw_highgarden_lannister_host:0 "Lannister Host of Highgarden"
