l_english:
 atfw_daenerys_pov.0001.t: "A king who will not kneel"
 atfw_daenerys_pov.0001.desc: "Jon Snow has refused your demand. He speaks of the dead while your enemies hold the throne your family built. Yet he has crossed the sea to ask for help, and Tyrion urges you to hear him. Allowing him to mine dragonglass costs you little. It may reveal whether this northern king can become an ally."
 atfw_daenerys_pov.0001.a: "He may have his dragonglass. My claim still stands."
 atfw_daenerys_pov.0002.t: "The warning beneath the stone"
 atfw_daenerys_pov.0002.desc: "Jon leads you past the veins of dragonglass to figures carved into the cavern walls. Children of the Forest and First Men stand together against a common enemy. He asks you to imagine a war older than your houses. You are not ready to accept every word, but the certainty with which you dismissed his warning begins to falter."
 atfw_daenerys_pov.0002.a: "Tell me what your people have seen."
 atfw_daenerys_pov.0003.t: "Beyond titles"
 atfw_daenerys_pov.0003.desc: "The King in the North is stubborn, but you begin to recognize something beneath his refusals. He speaks of the people he must protect more often than of the power he might gain. Your conversations no longer end at the first disagreement. You find yourself seeking his judgment, even when you suspect you will dislike his answer."
 atfw_daenerys_pov.0003.a: "I would hear his counsel again."
 atfw_daenerys_pov.0004.t: "Drogon lets him approach"
 atfw_daenerys_pov.0004.desc: "You watch Jon stand before Drogon. He is afraid; he would be a fool not to be. Yet he reaches out, slowly, and your dragon allows his hand to rest against his scales. You have seen men boast of courage and then flee that gaze. Jon makes no boast. For a moment you forget the answer you meant to demand of him."
 atfw_daenerys_pov.0004.a: "There is more to him than I understood."
 atfw_daenerys_pov.0005.t: "A dangerous proof"
 atfw_daenerys_pov.0005.desc: "The plan sounds scarcely less impossible than the enemy Jon describes: capture one of the dead and bring it south for Cersei to see. Tyrion argues that proof may win the truce you need. Jon intends to go himself. You question the risks as a queen should, but your unease remains after every argument has been answered."
 atfw_daenerys_pov.0005.a: "Bring us the proof. And come back."
 atfw_daenerys_pov.0006.t: "The raven from Eastwatch"
 atfw_daenerys_pov.0006.desc: "A raven brings word that Jon and his companions are trapped beyond the Wall. Waiting is the safer choice for your campaign, but each hour may cost their lives. You call for your dragons. Whatever doubts remain about his warning, you will see this enemy with your own eyes. You cannot leave him there."
 atfw_daenerys_pov.0006.a: "We fly north. Now."
 atfw_daenerys_pov.0007.t: "One of my children"
 atfw_daenerys_pov.0007.desc: "Viserion is gone. The sight of him falling will not leave you, nor the impossible army that surrounded Jon and his companions. This is no northern tale invented to distract you from the throne. You have paid for the truth with one of your children. As you wait for news of Jon, grief and fear leave little room for the queen you were before."
 atfw_daenerys_pov.0007.a: "I have seen them. I will fight them."
 atfw_daenerys_pov.0008.t: "His queen"
 atfw_daenerys_pov.0008.desc: "Jon is alive. Beside his sickbed, you promise that you will fight the dead together. When he calls you his queen, there is no court to applaud and no army to threaten him into obedience. You came north without securing his submission. Now he offers it freely. You hold his hand a little longer than you intended."
 atfw_daenerys_pov.0008.a: "We will face this together."
 atfw_daenerys_pov.0009.t: "The truth before Cersei"
 atfw_daenerys_pov.0009.desc: "Cersei asks for northern neutrality. A convenient lie might preserve the negotiation, but Jon says that he has already pledged himself to you. You are frustrated by what his honesty may cost. You are also moved by it. Later, away from your sister queen and her watching court, you find yourself thinking less about the pledge than about the man who would not deny it."
 atfw_daenerys_pov.0009.a: "I know what his word is worth."
 atfw_daenerys_pov.0010.t: "Rhaegar's son"
 atfw_daenerys_pov.0010.desc: "You find Jon in the crypts before Lyanna Stark's statue. He tells you that she and Rhaegar were his parents, married in secret, and that Sam and Bran have uncovered the truth. If he is right, he is your nephew and Rhaegar's legitimate son. The man you love has a claim that could precede your own. You question the evidence, struggling to understand what this means for both of you as the battle approaches."
 atfw_daenerys_pov.0010.a: "Then we must speak of what this means."
