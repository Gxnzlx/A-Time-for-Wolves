l_english:
 atfw_highgarden.0010.t: "Lions on the Roseroad"
 atfw_highgarden.0010.desc: "My scouts bring word of an army on the road to Highgarden. Jaime Lannister rides at its head, and Randyll Tarly marches with him. The banners that once defended the Reach now advance against it.\n\nThey will reach our walls in three days. I will remain and prepare the defense, but we cannot face this host alone. A raven must reach Dragonstone. Daenerys must know where the lions have gone."
 atfw_highgarden.0010.a: "I will defend Highgarden. Send word to Daenerys."
 atfw_highgarden.0011.t: "A Raven from the Reach"
 atfw_highgarden.0011.desc: "Tyrion brings me a letter from Highgarden. Olenna's scouts have sighted the Lannister army, with Randyll Tarly beside it. She intends to hold the castle and asks for aid before the enemy closes around her.\n\nMy Hand studies the message. His brother has marched south, leaving us to strike at Casterly Rock while the Reach lies exposed.\n\nI will not sit on Dragonstone while my allies are destroyed. We must prepare to depart. If Jaime takes Highgarden, he will still have to bring his soldiers and everything they have stolen back along the road."
 atfw_highgarden.0011.a: "Prepare the Dothraki. I will ride with Drogon."
