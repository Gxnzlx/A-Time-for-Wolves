 atfw_siege_watch.0003.t:0 "Highgarden Holds"
 atfw_siege_watch.0003.desc:0 "The offensive against Highgarden has been interrupted. For now, the attackers cannot impose their victory, and Olenna keeps her life and lands. The war may yet change the fate of the Reach, but this siege is over."
 atfw_siege_watch.0003.a:0 "Highgarden still stands."
