l_spanish:
 agot_group_agot_tfw:0 "La Hora del Lobo"

 agot_8303:0 "Guerra de las Cinco Reinas"
 agot_8303_desc:0 "Cersei Lannister se sienta en un trono de cenizas, con los gritos de sus enemigos aún resonando entre las ruinas del Gran Septo de Baelor. Coronada por el fuego y el miedo, la nueva Reina de los Siete Reinos gobierna mediante el terror, con un control sobre Desembarco del Rey tan frágil como el fuego valyrio que le ganó el trono.\n\nAl otro lado del Mar Angosto, Daenerys Targaryen navega hacia Poniente al frente de una vasta coalición. Respaldada por las flotas de los Hombres de Hierro de Yara Greyjoy, las vengativas lanzas de Dorne bajo la usurpadora Ellaria Arena, y los orgullosos estandartes del Dominio liderados por la indomable Olenna Tyrell, la Reina Dragón viene a reclamar su derecho de nacimiento.\n\nEn el Norte, Sansa Stark y Arya Stark maniobran para asegurar el legado de su familia, mientras los ejércitos del Valle aguardan bajo la vigilante mirada de Petyr Baelish. Y en las Tierras de los Ríos, la venganza de Arya ha dejado a la Casa Frey en el caos, abriendo la puerta a nuevos pretendientes.\n\n#bold Estas Reinas dan forma ahora al destino de Poniente — cada una con ejércitos, ambiciones y deudas de sangre que saldar. El reino está al borde de una guerra nueva y terrible. ¿Quién reclamará el Trono de Hierro?#!"

 bookmark_303_cersei_lannister:0 "La Reina Cersei I"
 bookmark_303_cersei_lannister_desc:0 "Cersei Lannister gobierna los Siete Reinos desde un trono forjado en fuego valyrio, con su poder apoyado en las humeantes ruinas del Gran Septo. Aislada por la pérdida pero inquebrantable en su voluntad, gobierna mediante el miedo, el cálculo y la fría certeza de que solo ella puede proteger el legado de la Casa Lannister.\n\n#bold Pero mientras los enemigos se congregan en cada horizonte, ¿podrá la Reina León mantener su corona o colapsará su reinado bajo el peso del mismo terror que lo aseguró?#!"
 bookmark_303_cersei_lannister_subheading:0 "Reina del Trono de Hierro"

 bookmark_303_daenerys_targaryen:0 "La Reina Daenerys 'Nacida de la Tormenta'"
 bookmark_303_daenerys_targaryen_desc:0 "Daenerys Targaryen cruza el Mar Angosto al frente de la mayor fuerza invasora que ha visto Poniente desde Aegon el Conquistador, con sus velas negras de dragones y venganza. Rodeada de aliados leales y armada con fuego, profecía e inquebrantable determinación, viene a reclamar el trono arrebatado a su familia.\n\n#bold Sin embargo, al pisar por fin las costas de su tierra natal, ¿unirá la Reina Dragón el reino bajo su estandarte o los fuegos que trae lo consumirán todo lo que espera gobernar?#!"
 bookmark_303_daenerys_targaryen_subheading:0 "Reina en el Este"

 bookmark_303_asha_greyjoy:0 "La Hija del Kraken"
 bookmark_303_asha_greyjoy_desc:0 "Yara Greyjoy, capitana del Viento Negro, navega al frente de los Hombres de Hierro que se negaron a doblar la rodilla ante la locura de su tío, abriéndose su propio camino por los mares con desafío y precisión. Feroz, leal e inflexible, reivindica su derecho no mediante profecías o conquistas, sino mediante el respeto ganado al timón y en batalla.\n\n#bold Sin embargo, al poner su fuerza al servicio de la causa de Daenerys Targaryen, ¿encontrarán por fin los Hombres de Hierro un futuro más allá del pillaje o se hundirá la apuesta de Yara bajo la creciente tormenta de reinas?#!"
 bookmark_303_asha_greyjoy_subheading:0 "Reina de las Islas del Hierro"

 bookmark_303_olenna_redwyne:0 "La Reina de las Espinas"
 bookmark_303_olenna_redwyne_desc:0 "Olenna Tyrell, la indomable Reina de las Espinas, es el último pilar inquebrantable de una casa destrozada por la traición y el fuego valyrio. Con su ingenio afilado como un arma y su duelo endurecido en resolución, alinea la fuerza del Dominio tras la guerra que se avecina, decidida a ver justicia por sus parientes asesinados.\n\n#bold Sin embargo, mientras las alianzas cambian y los dragones cruzan el mar, ¿será suficiente la astucia de Olenna para asegurar la venganza o se marchitará el último florecimiento de la Casa Tyrell en la tormenta que se aproxima?#!"
 bookmark_303_olenna_redwyne_subheading:0 "Reina de las Espinas"

 bookmark_303_ellaria_sand:0 "La Princesa Ellaria 'Arena"
 bookmark_303_ellaria_sand_desc:0 "Ellaria Arena, bastarda, usurpadora y ahora gobernante de facto de Dorne, comanda sus lanzas con una furia nacida de la pérdida y el deseo de transformar el reino que despreció a su familia. Habiendo tomado el poder mediante la sangre y el desafío, une su destino a la causa Targaryen en ascenso, buscando tanto la retribución como un futuro libre del viejo orden.\n\n#bold Pero a medida que la guerra se extiende por Poniente, ¿labrará la venganza de Ellaria un nuevo legado para Dorne o su rebelión será engullida por el mismo caos que ella ayudó a desatar?#!"
 bookmark_303_ellaria_sand_subheading:0 "Gobernante Usurpadora de Dorne"

 agot_8305:0 "La Manada Sobrevive"
 agot_8305_desc:0 "#italic ¡Larga vida al Rey!#! Brandon 'El Roto' Stark ha sido elegido nuevo Rey de Poniente.\n\n#italic ¡Larga vida a la Reina!#! Sansa Stark ha sido elevada al Alto Sitial de Invernalia y es la primera Reina de un Norte independiente.\n\nJon Nieve ha sido exiliado de vuelta al extremo norte tras el crimen de asesinar a su Reina, Daenerys Targaryen. Arya Stark ha abandonado el mundo conocido para siempre, siguiendo los pasos de Elissa Farman y navegando hacia el Oeste.\n\n#bold ¿Traerá por fin paz al reino el nuevo orden de una monarquía electiva, o verán ojos ambiciosos debilidad en los monarcas Stark del continente y quebrarán una vez más el frágil statu quo?#!"

 bookmark_305_brandon_stark:0 "Rey Brandon Stark 'El Roto'"
 bookmark_305_brandon_stark_desc:0 "Desde su regreso de los confines del norte más allá del Muro, el que fue un niño dulce y excitable ha cambiado. Ahora un joven tranquilo y solemne, Bran viajó al sur por primera vez para asistir al Gran Consejo del 304 y ayudar a determinar el nuevo líder de Poniente tras la muerte de la última Targaryen. Apoyado por Tyrion Lannister, fue capaz de ascender sin oposición al trono de los Seis Reinos.\n\n#bold ¿Fue elegido el Rey Bran porque verdaderamente tiene la mejor historia, o su tiempo más allá del Muro le permitió ascender al poder por medios más siniestros?#!"
 bookmark_305_brandon_stark_subheading:0 "Rey de Poniente"

 bookmark_305_sansa_stark:0 "Reina Sansa Stark"
 bookmark_305_sansa_stark_desc:0 "Desde que escapó de las garras de Desembarco del Rey y sobrevivió a los horrores de los planes de Ramsay Bolton y Meñique, Sansa Stark se ha convertido en una gobernante formidable. Ya no es la ingenua muchacha que soñaba con caballeros y romances; en su lugar se ha forjado como la Reina del Norte, asegurando la independencia de su tierra natal tras el Gran Consejo del 304. Paciente e inquebrantable, ahora guía a su pueblo con mano firme, garantizando que el Norte no vuelva a inclinarse ante el Sur.\n\n#bold ¿Reclamó Sansa su trono gracias a su resiliencia y determinación norteña, o aprendió ella también, como las otras Reinas que conoció, a jugar el juego de tronos de forma despiadada pero sutil?#!"
 bookmark_305_sansa_stark_subheading:0 "Reina en el Norte"

 bookmark_305_jon_snow:0 "Jon 'Nieve'"
 bookmark_305_jon_snow_desc:0 "En su día un bastardo criado en Invernalia, el viaje de Jon Nieve le llevó desde el Muro hasta el trono del Norte y más allá. Combatió a los Caminantes Blancos, lideró la Guardia de la Noche, e incluso fue proclamado Rey en el Norte, solo para doblar la rodilla ante Daenerys Targaryen con la esperanza de unir Poniente. Pero tras traicionar y matar a la Reina Dragón para salvar el reino, fue apartado y exiliado de vuelta al Norte lejano. Ahora lidera a un grupo de Salvajes más allá de las ruinas del Muro, dejando atrás la política y el deber para siempre.\n\n#bold ¿Ha sido Jon arrojado al olvido, o por fin ha encontrado la paz en la verdadera libertad?#!"
 bookmark_305_jon_snow_subheading:0 "El Lobo Blanco"

 bookmark_305_arya_stark:0 "Arya"
 bookmark_305_arya_stark_desc:0 "Sin ataduras de deber, familia o venganza, Arya Stark se prepara para zarpar hacia lo desconocido, dejando atrás las tierras de Poniente que en su día la forjaron como superviviente, guerrera y asesina. Desde las calles de Desembarco del Rey hasta los canales de Braavos, ha recorrido caminos que pocos se han atrevido a transitar, desafiado a la muerte y abatido al Rey de la Noche. Pero ahora, sin más batallas que librar, su espíritu inquieto la empuja hacia adelante. Los mapas del mundo terminan en las costas occidentales de Poniente, pero Arya se niega a creer que allí termina el mundo.\n\n#bold ¿Encontrará Arya Stark nuevas tierras al otro lado del Mar del Ocaso, o simplemente huye de un hogar al que ya no pertenece?#!"
 bookmark_305_arya_stark_subheading:0 "¿Nadie?"

 agot_8305_2:0 "Un Nuevo Orden"
 agot_8305_2_desc:0 "#italic ¡Larga vida al Rey!#! Brandon 'El Roto' Stark ha sido elegido nuevo Rey de Poniente.\n\n#italic ¡Larga vida a la Reina!#! Sansa Stark ha sido elevada al Alto Sitial de Invernalia y es la primera Reina de un Norte independiente.\n\n Un controvertido nuevo Lord Paramount del Dominio ha reemplazado a los Tyrell, y los improbables herederos de casas antiguas han tomado los asientos del Oeste, las Islas del Hierro, las Tierras de la Tormenta y Dorne.\n\n#bold ¿Traerá por fin paz al reino el nuevo orden de una monarquía electiva, o verán ojos ambiciosos debilidad en los monarcas Stark del continente y quebrarán una vez más el frágil statu quo?#!"

 bookmark_305_asha_greyjoy:0 "La Hija del Kraken"
 bookmark_305_asha_greyjoy_desc:0 "Guerrera, líder y ahora la última heredera legítima de la Casa Greyjoy, Yara ha pasado su vida demostrando que es tan feroz como cualquier hombre de los Hombres de Hierro. Luchó por su hermano Theon cuando nadie más lo haría, desafió a su tío Euron por el Trono de Sal y finalmente sobrevivió para ver el fin de la guerra que consumió Poniente. Con las Islas del Hierro ahora juramentadas al Rey Bran, Yara gobierna como su Dama, pero las costumbres de los Hombres de Hierro no se doblegan fácilmente a la diplomacia.\n\n#bold ¿Llevará Yara a los Hombres de Hierro a una nueva era de paz, o el llamado de la Vieja Costumbre y el mar salado será demasiado fuerte para resistir?#!"
 bookmark_305_asha_greyjoy_subheading:0 "Lady Paramount de las Islas del Hierro"

 bookmark_305_tyrion_lannister:0 "El Lord Tyrion"
 bookmark_305_tyrion_lannister_desc:0 "En su día un paria despreciado en su propia familia, Tyrion Lannister lleva más tiempo jugando al juego de tronos que la mayoría — a veces como maestro, a veces como peón. Ha asesorado a reyes y reinas, traicionado a gobernantes, y escapado de la muerte más veces de las que puede contar. Ahora, como Mano del Rey de Bran el Roto, sostiene el destino del reino en sus manos, con la misión de reconstruir un reino destrozado junto a un consejo de aliados improbables. Pero el poder es algo peligroso, y hasta las manos más sabias pueden cometer errores costosos.\n\n#bold ¿Podrá Tyrion traer por fin una paz duradera a Poniente, o sus fracasos pasados y el peso de la responsabilidad lo aplastarán una vez más?#!"
 bookmark_305_tyrion_lannister_subheading:0 "Guardián del Occidente"

 bookmark_305_bronn_blackwater:0 "Lord Bronn del Aguasnegras"
 bookmark_305_bronn_blackwater_desc:0 "De mercenario a lord, de lord a Maestre de la Moneda — el ascenso de Bronn entre la nobleza de Poniente ha sido de todo menos tradicional. En su día contento con luchar por oro y beber hasta perder el sentido, ahora se encuentra a cargo de las finanzas del reino, a pesar de no tener más cualificaciones que un instinto extraordinario para la supervivencia. Con Altojardín en su poder y un asiento en el Consejo Privado, Bronn por fin ha conseguido todo lo que siempre quiso... pero gestionar las monedas del reino es muy diferente a blandir una espada.\n\n#bold ¿Demostrará Bronn ser un hábil administrador de la riqueza del reino, o vaciará el tesoro más rápido de lo que la Mano del Rey vacía una jarra de vino?#!"
 bookmark_305_bronn_blackwater_subheading:0 "Lord Paramount del Dominio"

 bookmark_305_gendry_baratheon:0 "Lord Gendry 'El Toro'"
 bookmark_305_gendry_baratheon_desc:0 "En su día tan solo aprendiz de herrero en Desembarco del Rey, Gendry ha recorrido un largo camino desde la fragua. Hijo bastardo del Rey Robert Baratheon, luchó contra los muertos en Invernalia, sobrevivió años huyendo, y fue legitimizado inesperadamente como Lord de Bastión de Tormentas por la Reina Daenerys. Pero gobernar una casa noble es muy diferente a blandir un martillo, y Gendry ahora se enfrenta a un desafío distinto a cualquier campo de batalla:0 navegar por el traicionero mundo de la política y el poder.\n\n#bold ¿Demostrará Gendry ser digno del nombre Baratheon, o las tormentas de las Tierras de la Tormenta arrasarán a este lord advenedizo?#!"
 bookmark_305_gendry_baratheon_subheading:0 "Lord Paramount de las Tierras de la Tormenta"

 bookmark_305_edmure_tully:0 "Lord Edmure"
 bookmark_305_edmure_tully_desc:0 "En su día orgulloso Lord de Aguasdulces, Edmure Tully pasó gran parte de la guerra encadenado — primero como rehén de los Frey, luego como prisionero de los Lannister. Con su casa casi destruida y su dignidad maltrecha, fue liberado finalmente tras el fin de las guerras, solo para tropezar en su intento de reclamar el trono ante la asamblea de señores de Poniente. Restaurado ahora como Lord del Tridente, Edmure se enfrenta al desafío de reconstruir sus tierras fracturadas y demostrar que el nombre Tully aún tiene peso.\n\n#bold ¿Estará Edmure a la altura como verdadero gobernante de las Tierras de los Ríos, o será recordado para siempre como el lord que no supo mantenerse por sí solo?#!"
 bookmark_305_edmure_tully_subheading:0 "Lord Paramount de las Tierras de los Ríos"

 bookmark_305_robert_arryn:0 "Robalito"
 bookmark_305_robert_arryn_desc:0 "En su día un niño enfermizo y malcriado aferrado a las faldas de su madre, Robín Arryn — conocido formalmente ahora como Lord Robert — ha madurado en su papel de gobernante del Valle. Aunque su salud ha mejorado y su mente ha ganado en madurez, el heredero recluido aún carece de experiencia en guerra, política y liderazgo. Con el Valle en pie mientras gran parte de Poniente yace en ruinas, muchos se preguntan si su joven lord tiene lo necesario para gobernar, o si sus consejeros seguirán pensando por él.\n\n#bold ¿Demostrará Robert Arryn ser un digno Guardián del Este, o no será más que un halcón mimado en una jaula dorada?#!"
 bookmark_305_robert_arryn_subheading:0 "Lord Paramount del Valle"

 bookmark_305_manfrey_martell:0 "El Príncipe Manfrey"
 bookmark_305_manfrey_martell_desc:0 "Dorne siempre se ha mantenido apartado del resto de Poniente, y bajo el Príncipe Manfrey Martell esa distancia solo ha crecido. A diferencia de sus predecesores, Manfrey ha abrazado las viejas costumbres roynas, rechazando la Fe de los Siete en favor de los dioses que sus antepasados siguieron al cruzar el Mar Angosto. Con los Siete Reinos ahora bajo el gobierno del Rey Bran, Dorne sigue siendo independiente en todo salvo en el nombre, con su príncipe trazando su propio rumbo en una nueva era incierta.\n\n#bold ¿Restaurará el Príncipe Manfrey las tradiciones perdidas de los Rhoynares y hará de Dorne una nación verdaderamente independiente, o sus creencias heterodoxas y las presiones del gobierno lo hundirán bajo las arenas?#!"
 bookmark_305_manfrey_martell_subheading:0 "Príncipe de Dorne"

 bookmark_305_elyas_scales:0 "Ser Elyas Scales"
 bookmark_305_elyas_scales_desc:0 "#bold La Reina ha muerto.#! \n\nHace apenas unos meses, La Reina Daenerys Targaryen 'Último Dragón' fue asesinada por el bastardo del perro del Usurpador. Pero algunos dicen que en estos tiempos la muerte no es para siempre... \n\nSe dice que en el helado Norte los Otros devolvieron legiones de muertos a la vida, que el Dios de Luz trajo de vuelta a Lord Beric Dondarrion desde el más allá, y algunos rumores afirman que el propio Bastardo Asesino de Reinas fue devuelto a la vida por Lady Melisandre de Asshai. \n\n#bold Larga vida a la Reina...#! \n\n¿Podra R'hllor, el Señor de Luz, resucitar a la Reina Dragón para reclamar su lugar legítimo trono, y así purgar a los Infieles con Fuego y Sangre?#!"
 bookmark_305_elyas_scales_subheading:0 "El Caballero de las Escamas"

 bookmark_305_aurane_waters:0 "El Rey Pirata Aurane 'Mares'"
 bookmark_305_aurane_waters_desc:0 "La antigua Reina Cersei Lannister fue tan imprudente como para confiar la Flota Real a su nuevo Lord Almirante, el bastardo de la Marca de la Deriva, Aurane Waters. A la primera oportunidad, el Almirante desapareció con la flota, y apenas unas semanas después comenzaron a llegar rumores a la capital sobre un nuevo Rey Pirata en las Rocas Graduadas que se hacía llamar 'El Señor de las Aguas'. Con una flota de galeras reales a su mando, Aurane ha labrado rápidamente un dominio en las traicioneras aguas de las Rocas Graduadas. Se ha convertido no solo en una amenaza para los mercaderes de Essos, sino también para las grandes casas del Mar Angosto, incluidos sus propios parientes, la Casa Velaryon, que durante mucho tiempo se han enorgullecido de ser los amos de las mareas. \n\n#bold ¿Encontrará Aurane Waters aliados entre los señores descontentos del Mar Angosto, o la nueva paz del Rey será ahogada por la marea de su ambición?#!"
 bookmark_305_aurane_waters_subheading:0 "Rey Pirata de las Rocas Graduadas"

 bookmark_305_monterys_velaryon:0 "El Lord Monterys"
 bookmark_305_monterys_velaryon_desc:0 "La orgullosa Casa Velaryon de la Marca de la Deriva ha resistido siglos de tormenta y marea, actuando a menudo como leal aliada de la Casa Targaryen. Pero con los dragones desaparecidos y los mares ahora surcados por piratas, Lord Monterys Velaryon hereda su asiento en un momento de incertidumbre. Las Rocas Graduadas son un hervidero, Aurane Waters reclama el dominio como rey pirata, y la otrora gran flota Velaryon está mermada. El joven Monterys debe decidir si restaurar el antiguo dominio de su casa sobre los mares o desvanecerse en la irrelevancia entre los señores de Poniente.\n\n#bold ¿Se alzará Monterys para reclamar el legado de los Velaryon como amos del Mar Angosto, o la Marca de la Deriva se hundirá bajo las olas de la historia?#!"
 bookmark_305_monterys_velaryon_subheading:0 "Señor de las Mareas"

 bookmark_305_davos_seaworth:0 "El Lord Davos"
 bookmark_305_davos_seaworth_desc:0 "De contrabandista a caballero, de caballero a lord, Davos Seaworth ha vivido una vida que pocos podrían imaginar. En su día llamado el Caballero de la Cebolla por la carga que salvó a un Stannis Baratheon famélico, se convirtió en un consejero de confianza y, contra todo pronóstico, en una voz de razón en un mundo de ambición y traición. Ahora, tras las guerras que sacudieron Poniente, Davos ostenta el título de Lord del Empapado y sirve como uno de los consejeros más firmes del reino. Pero los títulos importan poco al hombre que en su día arriesgó todo por el honor y la lealtad.\n\n#bold ¿Encontrará el Lord Davos su lugar en el nuevo orden como verdadero estadista, o su pasado de contrabandista lo mantendrá para siempre a la sombra de los grandes señores?#!"
 bookmark_305_davos_seaworth_subheading:0 "El Caballero de la Cebolla"

 bookmark_315_sansa_stark:0 "La Reina Sansa"
 bookmark_315_sansa_stark_desc:0 "Han pasado diez largos años desde que Sansa Stark fue coronada Reina en el Norte. \n\nEn el Sur el mundo ha cambiado:0 la Anarquía en el Dominio ha provocado la mayor redistribución de fronteras desde la Conquista de Aegon y un nuevo marco legal para el Reino. El Rey Brandon ha trasladado la capital fuera de Desembarco del Rey y la ha instalado en Harrenhal, una ola de turbulencia religiosa ha traído conversiones masivas en las Tierras de los Ríos y radicalización en el Valle. \n\n#bold Pero en el Norte, poco ha cambiado...#!"

 bookmark_366_joffrey_lannister:0 "El Rey Joffrey 'El León de Plata'"
 bookmark_366_joffrey_lannister_desc:0 "Han pasado siete semanas desde la muerte del Rey Oscar 'Mano Segura' Tully, y siete semanas de la primera elección disputada en la historia de Poniente. El resultado, una sorprendente victoria para Joffrey Lannister, primo del Lord del Oeste. Jaime Lannister, el segundo más votado, impugna los resultados de la elección y se ha retirado a Roca Casterly. No se ha emitido ninguna declaración formal de independencia, pero los Señores de la Alianza Occidental no están cumpliendo sus obligaciones feudales con el nuevo Rey. \n\n#bold ¿Podrá el nuevo Rey estar a la altura del momento y traer de vuelta a su primo al redil? ¿O es la guerra civil una vez más inevitable en Poniente?#!"

 agot_group_agot_tfw310:0 "El Nuevo Pacto"
 agot_8310:0 "Un Reino Reforjado"
 agot_8310_desc:0 "#italic El Pacto está firmado.#! Al amanecer del primer día del 310 dC, los señores y damas de Poniente ratificaron el Nuevo Pacto en un Gran Consejo en Harrenhal, vinculando el reino a una monarquía electiva y reformando su antiguo orden feudal.\n\nEl Dominio está dividido tras la plaga y la rebelión, su gran casa extinguida. Las Tierras de los Ríos lloran al Lord Edmure, ahora gobernadas por su joven hijo. Las Tierras de la Tormenta ponen a prueba la fortaleza de su lord bastardo advenedizo, mientras Dorne sigue su propio camino bajo el Príncipe Manfrey. Al otro lado del Mar Angosto, aún se agitan susurros de dragones, piratas y pretendientes.\n\n#bold ¿Traerá el Nuevo Pacto a Poniente una era de paz y compromiso, o las viejas ambiciones y las heridas recientes volverán a desgarrar el reino?#!"

 bookmark_310_brandon_stark:0 "El Rey Brandon 'El Roto'"

 bookmark_310_brandon_stark_desc:0 "El primer Rey de Poniente elegido en lugar de coronado por nacimiento, el Rey Bran gobierna desde su nuevo asiento en Harrenhal. Su reinado ha comenzado con grandes cambios y turbulencias, mientras el reino se recupera de una devastadora plaga y rebelión en el Dominio, y una oleada de agitación religiosa que amenaza con romper la Fe de los Siete. El Rey Bran ya ha dejado su huella en la historia trasladando la capital y supervisando el establecimiento del 'Nuevo Pacto', un nuevo marco legal para Poniente. Sin embargo, en un reino de tradicionalistas, muchos cuestionan la sabiduría de tener a un adorador de árboles norteño como monarca, pues no piensa, actúa ni habla como un Rey.\n\n#bold ¿Asegurará el conocimiento del pasado y el futuro de Bran la prosperidad de su nuevo reino, o su distanciamiento del mundo de los hombres será su perdición definitiva?#!"

 bookmark_310_manfrey_martell:0 "El Príncipe Manfrey Martell"

 bookmark_310_manfrey_martell_desc:0 "El nuevo orden ha llegado a Poniente, pero no a Dorne. Durante siglos, los Martell han portado el sol y la lanza como propios, y el Consejo del 305 dC, que vio la elección de un nuevo Rey y la reordenación del reino, fue asunto de poca importancia para ellos; Dorne conserva su ley propia. El Príncipe Manfrey Martell gobierna ahora desde Lanza del Sol, pero con un Poniente en constante cambio al norte, Dorne permanece solo.\n\n#bold ¿Continuará el Príncipe Manfrey manteniendo el antiguo desafío y la autonomía de Dorne, o el peso del nuevo orden mundial lo obligará finalmente a doblar la rodilla?#!"

 bookmark_310_gendry_baratheon:0 "El Lord Gendry Baratheon"

 bookmark_310_gendry_baratheon_desc:0 "De una vida de bastardo en los callejones de Desembarco del Rey a lord legítimo, Gendry Baratheon ha vivido una vida de cambios asombrosos. Como último heredero varón vivo del Rey Robert, fue legitimizado y le fue concedido el asiento de Bastión de Tormentas. Su ascenso, sin embargo, no ha estado exento de desafíos. Una rebelión liderada por los Fell amenazó con desgarrar las Tierras de la Tormenta, y Gendry se vio obligado a buscar la ayuda del Rey. Al sofocar la rebelión, el Rey ha asegurado su posición, pero Gendry ahora se encuentra en una posición de gran deuda con el nuevo monarca.\n\n#bold ¿Será inquebrantable la lealtad de Gendry a la corona, o buscará saldar su deuda y forjar un nuevo camino para la Casa Baratheon?#!"

 bookmark_310_talla_tarly:0 "La Dama Talla Tarly"

 bookmark_310_talla_tarly_desc:0 "Durante siglos, las Marcas del Dominio han sido la primera línea de defensa contra los dornienses, y ninguna casa ha sangrado más por su tierra que los Tarly. Con la muerte del Lord Randyll Tarly y la posterior Anarquía en el Dominio, el nuevo Rey vio una oportunidad de recompensar la lealtad. Así, las Marcas han sido convertidas en su propia Lordía Paramount, con el Rey proponiendo a la hija del Lord Randyll, Talla Tarly, para liderarlas.\n\n#bold ¿Podrá Talla Tarly, como elegida del Rey, unir las casas divididas de las Marcas y demostrar ser una líder digna en esta nueva era de incertidumbre?#!"

 bookmark_310_leyton_hightower:0 "El Lord Leyton Hightower"

 bookmark_310_leyton_hightower_desc:0 "Como la casa más antigua y venerada del Dominio, los Hightower han ejercido durante mucho tiempo una influencia más allá de su título formal. Con los Tyrell derrocados y el nuevo decreto del Rey, Antigua es ahora el corazón de su propia Lordía Paramount independiente. Los Hightower, conocidos durante mucho tiempo por su profunda conexión con la Ciudadela y la Fe, ahora se encuentran en la cúspide del poder.\n\n#bold ¿Usarán su nueva autoridad para moldear el futuro político y religioso de Poniente, o su ambición los llevará al conflicto con sus nuevos vecinos?#!"

 bookmark_310_mathis_rowan:0 "El Lord Mathis Rowan"

 bookmark_310_mathis_rowan_desc:0 "Durante siglos, los Rowan han sido vasallos leales de los Tyrell, y su asiento en Bosque Dorado ha sido símbolo de la riqueza y belleza del Dominio. Con las grandes casas del Dominio en desorden tras la Anarquía, el Rey Bran ha visto conveniente dividir el antiguo reino en tres reinos separados. La Casa Rowan ostenta ahora el título de Lord Paramount de los Bosques Dorados, con el Lord Mathis Rowan al frente de un reino incipiente.\n\n#bold ¿Podrá navegar la intriga política del Dominio y forjar una nueva dinastía, o la Anarquía será su perdición?#!"

 bookmark_310_amanda_peake:0 "La Dama Amanda Peake"

 bookmark_310_amanda_peake_desc:0 "Con tan solo dos años de edad, Amanda Peake es una niña en un mundo de hombres, un peón en el mortal juego de tronos que ha consumido el Dominio. Su padre, el ambicioso Lord Titus Peake, intentó usarla como símbolo de su aspiración a la Lordía Paramount, pero sus pretensiones fueron tan efímeras como la plaga que arrasó Altojardín. Con las fuerzas Peake diezmadas y su poder quebrantado, la joven Amanda es todo lo que queda del fugaz intento de su casa de alcanzar el poder.\n\n#bold ¿Podrá su casa recuperarse de sus devastadoras pérdidas y encontrar un nuevo lugar en los tres nuevos Reinos del Dominio, o los Peake, en su día una gran casa, se perderán para siempre entre las sombras de su ambición?#!"


 bookmark_310_alkeyne_florent:0 "El Lord Alkeyne Florent"

 bookmark_310_alkeyne_florent_desc:0 "Con la Anarquía habiendo desgarrado el Dominio, la Casa Florent, una casa con aspiraciones al propio Altojardín, ha visto mermadas sus fortunas. Los nuevos Lords Paramount del Dominio fueron elegidos por su lealtad, no por sus antiguas estirpes, y como resultado, la Casa Florent fue ignorada. Con las tierras ahora divididas en tres reinos separados, el Lord Alkeyne Florent es un poderoso señor en Antigua, pero es vasallo de la recién elevada Casa Hightower. Una casa orgullosa con aspiraciones al trono del Dominio, los Florent no soportan de buen grado que señores de menor rango gobiernen sobre ellos.\n\n#bold ¿Permanecerá Alkeyne Florent como vasallo leal a su nuevo señor, o usará el antiguo derecho de su casa para restaurar la antigua gloria de los Florent y reclamar el gobierno del Dominio?#!"

 bookmark_310_anders_yronwood:0 "El Lord Anders Yronwood"

 bookmark_310_anders_yronwood_desc:0 "Mientras el resto de las grandes casas de Poniente estaban en convulsión tras la muerte de Daenerys Targaryen, Dorne permaneció aparte. Pero un Príncipe de Dorne solo es tan poderoso como el apoyo que le brindan sus vasallos. Entre los más poderosos de estos se encuentra la Casa Yronwood, cuyo asiento se halla en la misma frontera con las Tierras de la Tormenta. El Lord Anders Yronwood es el señor de una casa con una larga y orgullosa historia, marcada tanto por la lealtad a los Martell como por la amarga rivalidad. Con el nuevo Rey en el Norte y un Baratheon legitimizado gobernando las Tierras de la Tormenta, las antiguas disputas de Dorne corren el riesgo de estallar de nuevo.\n\n#bold ¿Permanecerá Anders Yronwood como vasallo leal a su Príncipe, o verá una oportunidad en el nuevo orden para avanzar los intereses de su casa y desafiar el poder de Lanza del Sol?#!"

 bookmark_303_jon_snow:0 "Jon Nieve"
 bookmark_303_jon_snow_desc:0 "Antaño bastardo de Invernalia y lord comandante de la Guardia de la Noche, Jon Nieve regresó de la muerte, derrotó a los Bolton y fue aclamado Rey en el Norte. Pero la victoria no ha traído la paz. El ejército de los muertos avanza desde más allá del Muro, mientras Daenerys Targaryen ha desembarcado en Rocadragón con dragones y una pretensión al Trono de Hierro. El Norte ha elegido a Jon como su rey, pero la guerra que de verdad importa puede obligarlo a buscar aliados más allá de sus fronteras.\n\n#bold ¿Preservará el Lobo Blanco la independencia que tanto le costó recuperar al Norte, o el deber lo llevará a buscar la ayuda de la reina dragón?#!"
 bookmark_303_jon_snow_subheading:0 "El Lobo Blanco"
