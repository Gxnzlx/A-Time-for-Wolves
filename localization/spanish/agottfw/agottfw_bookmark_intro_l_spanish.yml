l_spanish:
 atfw_bookmark_intro.supporters.t:0 "El regreso del dragón"
 atfw_bookmark_intro.enemies.t:0 "La hija del Rey Loco"

 # Daenerys Targaryen 
 atfw_bookmark_intro.0001.desc:0 "Toda mi vida he oído hablar de Poniente como del hogar que me fue arrebatado antes incluso de que pudiera recordarlo. Ahora, después de años de exilio, por fin he regresado. Rocadragón, la fortaleza donde nací y antiguo asiento de mis antepasados, vuelve a estar en manos Targaryen. El dragón de tres cabezas ondea de nuevo sobre sus almenas, y mis tres dragones surcan sus cielos.\n\nNo he regresado sola. Mis Inmaculados y mis dothraki han cruzado el mar conmigo, mientras Dorne y el Dominio han unido su causa a la mía. Al otro lado de la bahía, Cersei Lannister ocupa el Trono de Hierro que me pertenece por derecho de sangre.\n\nHe pasado demasiado tiempo huyendo, reuniendo fuerzas y soñando con este momento. Ya no soy la niña que abandonó Rocadragón durante una tormenta. He vuelto como reina, y esta vez no volveré a huir.\n\n#bold He regresado a Poniente para recuperar aquello que le fue arrebatado a mi familia.#!"
 atfw_bookmark_intro.0001.a:0 "Tomaré lo que es mío con fuego y sangre."

 # Olenna Tyrell
 atfw_bookmark_intro.0002.desc:0 "Mi casa lo ha perdido casi todo. Mace, Margaery y Loras murieron cuando Cersei Lannister redujo el Septo de Baelor a cenizas, y con ellos se extinguió buena parte del futuro que había construido para la Casa Tyrell. Ya no quedan matrimonios que concertar ni intrigas cortesanas capaces de devolverme aquello que me fue arrebatado.\n\nPero aún me queda el Dominio. Me quedan sus ejércitos, sus riquezas y el tiempo suficiente para ajustar cuentas antes de reunirme con mi familia.\n\nDaenerys Targaryen ha regresado a Poniente y se ha establecido en Rocadragón. Tiene dragones, ejércitos y una pretensión al Trono de Hierro. Yo tengo algo mucho más sencillo: una deuda que cobrar. Mientras Cersei siga sentada en ese trono, no descansaré sabiendo que los míos siguen sin ser vengados.\n\n#bold Puede que mi casa no tenga futuro, pero todavía puedo vengar su pasado.#!"
 atfw_bookmark_intro.0002.a:0 "Que Cersei recuerde lo que hizo."

 # Ellaria Arena
 atfw_bookmark_intro.0003.desc:0 "Elia. Sus hijos. Oberyn. Demasiados nombres, demasiados muertos y demasiados años viendo a los Lannister escapar de las consecuencias de sus actos. Ahora Cersei Lannister ocupa el Trono de Hierro, y por fin tengo una oportunidad de hacer pagar a su casa por toda la sangre que ha derramado.\n\nDaenerys Targaryen ha regresado a Poniente y ha establecido su corte en Rocadragón. También ella tiene cuentas pendientes con quienes destruyeron a su familia, y sus dragones y ejércitos pueden convertir su pretensión en algo más que palabras.\n\nLas lanzas de Dorne se unirán al dragón. No lo haré por amor al Trono de Hierro ni por lealtad a una reina a la que apenas conozco. Lo haré porque nuestros enemigos son los mismos y porque ha llegado el momento de que los Lannister respondan por lo que hicieron.\n\n#bold Han tomado demasiado de nosotros. Ha llegado la hora de cobrárselo.#!"
 atfw_bookmark_intro.0003.a:0 "Por Oberyn. Por Dorne."

 # Asha Greyjoy
 atfw_bookmark_intro.0004.desc:0 "Euron me arrebató las Islas del Hierro, se hizo coronar rey y me obligó a abandonar el hogar que pretendía gobernar. Ahora ha llevado la Flota de Hierro hasta Cersei Lannister y ofrece sus barcos a cambio de una corona que jamás debería haber llevado.\n\nPero no huí de las islas para vivir el resto de mis días en el exilio. Daenerys Targaryen necesita barcos y aliados para conquistar Poniente; yo necesito una reina capaz de ayudarme a derrocar a Euron. Nuestro acuerdo es sencillo: lucharé por su corona y ella reconocerá mi derecho a las Islas del Hierro.\n\nMi tío tiene la Flota de Hierro y se cree intocable. Pronto descubrirá que todavía estoy aquí y que no pienso permitir que conserve lo que me arrebató.\n\n#bold Euron me quitó las Islas del Hierro. Volveré para recuperarlas.#!"
 atfw_bookmark_intro.0004.a:0 "Recuperaré las Islas del Hierro."

 # Cercei Lannister
 atfw_bookmark_intro.0005.desc:0 "Mis enemigos creyeron que podían humillarme. Los Tyrell, el Gorrión Supremo y sus fanáticos que llenaron Desembarco del Rey convencidos de que podían obligarme a inclinar la cabeza. Ahora todos ellos son cenizas bajo las ruinas del Septo de Baelor, y soy yo quien ocupa el Trono de Hierro.\n\nY ahora llega otra. Daenerys Targaryen, la hija del Rey Loco, ha desembarcado en Rocadragón para reclamar mi corona. Dicen que ha traído consigo una horda de bárbaros dothraki, un ejército de eunucos esclavos y hasta tres grandes dragones que obedecen sus órdenes. Dorne y lo que queda de los Tyrell se han apresurado a esconderse tras ella, convencidos de que una muchacha Targaryen y unos monstruos salidos de viejas historias bastarán para expulsarme del trono.\n\nQue lo crean.\n\nRobert está muerto. Ned Stark está muerto. El Gorrión Supremo está muerto. Margaery y toda su orgullosa familia ardieron juntos cuando decidí que ya había soportado suficiente. Uno tras otro, todos los que intentaron destruirme acabaron muertos mientras yo seguía en pie.\n\n#bold Si la hija del Rey Loco cree que será diferente, pronto aprenderá la misma lección que todos los demás.#!"
 atfw_bookmark_intro.0005.a:0 "Que venga."

 # Jon Nieve
 atfw_bookmark_intro.jon.t:0 "La batalla ha terminado"
 atfw_bookmark_intro.0006.desc:0 "Invernalia vuelve a pertenecer a los Stark. Ramsay Bolton ha muerto, sus hombres yacen derrotados y el huargo vuelve a ondear sobre las murallas del hogar que creí perdido para siempre. Después de todo lo ocurrido, Sansa y yo hemos regresado a casa.\n\nPero recuperar Invernalia nunca fue el final de mi guerra. Vi al Rey de la Noche en Casa Austera. Vi lo que puede hacer con los muertos y sé que, mientras los señores de Poniente continúan librando sus guerras por castillos y coronas, un ejército que no conoce hambre, miedo ni cansancio marcha hacia el Muro.\n\nEl Norte, sin embargo, está exhausto y dividido. Algunas casas lucharon junto a nosotros contra los Bolton; otras permanecieron al margen, y algunas entregaron sus hombres a Ramsay. Ahora todas deberán decidir qué lugar ocuparán en lo que está por venir.\n\nDebo reunir los estandartes en Invernalia. Hay viejas cuentas que resolver, juramentos que renovar y una guerra mucho mayor para la que debemos prepararnos.\n\n#bold He recuperado mi hogar. Ahora debo preparar al Norte para la verdadera guerra.#!"
 atfw_bookmark_intro.0006.a:0 "Convocaré a todos los estandartes en Invernalia."