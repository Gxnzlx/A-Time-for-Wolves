l_spanish:
 atfw_bookmark_intro.supporters.t:0 "El regreso del dragón"
 atfw_bookmark_intro.enemies.t:0 "La hija del Rey Loco"

 # Daenerys Targaryen 
 atfw_bookmark_intro.0001.desc:0 "Toda tu vida has oído hablar de Poniente como de un hogar que te fue arrebatado antes incluso de que pudieras recordarlo. Ahora, después de años de exilio, por fin has regresado. Rocadragón, la fortaleza donde naciste y antiguo asiento de tus antepasados, vuelve a estar en manos Targaryen. El dragón de tres cabezas ondea de nuevo sobre sus almenas, y tres dragones vivos surcan sus cielos.\n\nNo has regresado sola. Los Inmaculados y los dothraki han cruzado el mar contigo, mientras Dorne y el Dominio han unido su causa a la tuya. Al otro lado de la bahía, Cersei Lannister ocupa el Trono de Hierro que consideras tuyo por derecho de sangre.\n\nHas pasado demasiado tiempo huyendo, reuniendo fuerzas y soñando con este momento. Ya no eres la niña que abandonó Rocadragón durante una tormenta. Has vuelto como reina, y esta vez no volverás a huir.\n\n#bold Has regresado a Poniente para recuperar aquello que le fue arrebatado a tu familia.#!"
 atfw_bookmark_intro.0001.a:0 "Tomaré lo que es mío con fuego y sangre."

 # Olenna Tyrell
 atfw_bookmark_intro.0002.desc:0 "Tu casa lo ha perdido casi todo. Mace, Margaery y Loras murieron cuando Cersei Lannister redujo el Septo de Baelor a cenizas, y con ellos se extinguió buena parte del futuro que habías construido para la Casa Tyrell. Ya no quedan matrimonios que concertar ni intrigas cortesanas capaces de devolverte aquello que te fue arrebatado.\n\nPero aún queda el Dominio. Quedan sus ejércitos, sus riquezas y una anciana que no tiene intención de morir antes de ajustar cuentas.\n\nDaenerys Targaryen ha regresado a Poniente y se ha establecido en Rocadragón. Tiene dragones, ejércitos y una pretensión al Trono de Hierro. Tú tienes algo mucho más sencillo: una deuda que cobrar. Mientras Cersei siga sentada en ese trono, la sangre de tu familia continuará clamando justicia.\n\n#bold Puede que la Casa Tyrell no tenga futuro, pero todavía puede vengar su pasado.#!"
 atfw_bookmark_intro.0002.a:0 "Que Cersei recuerde lo que hizo."

 # Ellaria Arena
 atfw_bookmark_intro.0003.desc:0 "Elia. Sus hijos. Oberyn. Demasiados nombres, demasiados muertos y demasiados años viendo a los Lannister escapar de las consecuencias de sus actos. Ahora Cersei Lannister ocupa el Trono de Hierro, y tienes por fin una oportunidad de hacer pagar a su casa por toda la sangre derramada.\n\nDaenerys Targaryen ha regresado a Poniente y establecido su corte en Rocadragón. También ella tiene cuentas pendientes con quienes destruyeron a su familia, y sus dragones están acompañados por ejércitos capaces de convertir su pretensión en algo más que palabras.\n\nLas lanzas de Dorne se unirán al dragón. No por amor al Trono de Hierro ni por lealtad a una reina a la que apenas conoces, sino porque vuestra causa conduce hasta los mismos enemigos.\n\n#bold Los Lannister tomaron demasiado de Dorne. Ha llegado la hora de cobrárselo.#!"
 atfw_bookmark_intro.0003.a:0 "Por Oberyn. Por Dorne."

 # Asha Greyjoy
 atfw_bookmark_intro.0004.desc:0 "Euron te arrebató las Islas del Hierro, se hizo coronar rey y te obligó a abandonar el hogar que pretendías gobernar. Ahora ha llevado la Flota de Hierro hasta Cersei Lannister y ofrece sus barcos a cambio de una corona que jamás debería haber llevado.\n\nPero no huiste de las islas para vivir el resto de tus días en el exilio. Daenerys Targaryen necesita barcos y aliados para conquistar Poniente; tú necesitas una reina capaz de ayudarte a derrocar a Euron. El acuerdo es sencillo: lucharás por su corona y ella reconocerá tu derecho a las Islas del Hierro.\n\nTu tío tiene la Flota de Hierro y se cree intocable. Pronto descubrirá que todavía quedan Greyjoy dispuestos a disputarle el mar.\n\n#bold Euron te arrebató las Islas del Hierro. Volverás para recuperarlas.#!"
 atfw_bookmark_intro.0004.a:0 "Recuperaré las Islas del Hierro."

 # Cercei Lannister
 atfw_bookmark_intro.0005.desc:0 "La hija del Rey Loco ha regresado. Daenerys Targaryen ha desembarcado en Rocadragón con tres dragones, un ejército de Inmaculados, una horda dothraki y aliados entre las grandes casas de Poniente. Dorne y el Dominio ya se han declarado por ella, y sus consejeros creen que tu reinado terminará tan rápido como comenzó.\n\nQue lo crean.\n\nTú eres quien ocupa el Trono de Hierro. Desembarco del Rey está en tus manos, Jaime dirige tus ejércitos y Euron Greyjoy ha llegado con la Flota de Hierro y sus propias ambiciones. Has sobrevivido a Robert, a Ned Stark, a los Tyrell, al Gorrión Supremo y a todos aquellos que intentaron apartarte del poder.\n\nDaenerys puede llamarse reina cuanto quiera desde su isla. Si pretende gobernar los Siete Reinos, tendrá que arrebatártelos primero.\n\n#bold La hija de Aerys ha venido por tu corona. Que descubra cuánto cuesta tomarla.#!"
 atfw_bookmark_intro.0005.a:0 "Que venga."

 # Jon Nieve
 atfw_bookmark_intro.jon.t:0 "La batalla ha terminado"
 atfw_bookmark_intro.0006.desc:0 "Invernalia vuelve a pertenecer a los Stark. Ramsay Bolton ha muerto, sus hombres yacen derrotados y el huargo vuelve a ondear sobre las murallas del hogar que creíste perdido para siempre. Después de todo lo ocurrido, tú y Sansa habéis regresado a casa.\n\nPero recuperar Invernalia nunca fue el final de la guerra. Viste al Rey de la Noche en Casa Austera. Viste lo que puede hacer con los muertos y sabes que, mientras los señores de Poniente continúan librando sus guerras por castillos y coronas, un ejército que no conoce hambre, miedo ni cansancio marcha hacia el Muro.\n\nEl Norte, sin embargo, está exhausto y dividido. Algunas casas lucharon junto a ti contra los Bolton; otras permanecieron al margen, y algunas entregaron sus hombres a Ramsay. Ahora todas deberán decidir qué lugar ocuparán en lo que está por venir.\n\nLos estandartes deben reunirse en Invernalia. Hay viejas cuentas que resolver, juramentos que renovar y una guerra mucho mayor para la que prepararse.\n\n#bold Has recuperado tu hogar. Ahora debes preparar al Norte para la verdadera guerra.#!"
 atfw_bookmark_intro.0006.a:0 "Convocaré a todos los estandartes en Invernalia."