l_spanish:
 atfw_bookmark_intro.supporters.t:0 "El regreso del dragón"
 atfw_bookmark_intro.enemies.t:0 "La hija del Rey Loco"

 atfw_bookmark_intro.0001.desc:0 "Tras una vida de exilio, por fin has regresado a Poniente. Rocadragón, el antiguo asiento de tus antepasados, vuelve a estar en manos Targaryen, y sobre sus almenas ondea de nuevo el dragón de tres cabezas. Dorne y el Dominio han acudido a tu causa, mientras tus dragones proyectan sus sombras sobre las costas del reino.\n\nEn Desembarco del Rey, Cersei Lannister se aferra al Trono de Hierro que reclamas por derecho de sangre. Los grandes señores observan y esperan, pero la hora de las decisiones se acerca.\n\n#bold Has vuelto a Poniente para reclamar los Siete Reinos.#!"
 atfw_bookmark_intro.0001.a:0 "Tomaré lo que es mío con fuego y sangre."

 atfw_bookmark_intro.0002.desc:0 "El dragón ha regresado a Poniente, y con él llega la oportunidad de saldar las cuentas pendientes de tu casa. Daenerys Targaryen ha tomado Rocadragón y alza su estandarte contra Cersei Lannister, la mujer responsable de la ruina de los Tyrell y de la muerte de tantos de los tuyos.\n\nEl Dominio dispone aún de hombres, oro y cosechas, y ahora sus fuerzas marcharán junto a las de la reina dragón. La guerra por el Trono de Hierro ha comenzado de nuevo.\n\n#bold Esta vez, el león conocerá las espinas.#!"
 atfw_bookmark_intro.0002.a:0 "Que Cersei recuerde lo que hizo."

 atfw_bookmark_intro.0003.desc:0 "Daenerys Targaryen ha cruzado el mar Angosto y establecido su poder en Rocadragón. Para Dorne, su regreso trae algo más que una nueva pretendiente al Trono de Hierro: trae una oportunidad de vengar a los muertos y ajustar cuentas con la Casa Lannister.\n\nLas lanzas de Dorne se unen al dragón. Cersei ocupa aún el Trono de Hierro, pero su dominio será puesto a prueba por fuego, sangre y antiguas deudas.\n\n#bold Dorne no ha olvidado.#!"
 atfw_bookmark_intro.0003.a:0 "Por Oberyn. Por Dorne."

 atfw_bookmark_intro.0004.desc:0 "Daenerys Targaryen ha regresado a Poniente y sus enemigos ya se preparan para la guerra. Tú también tienes cuentas que saldar. Euron te arrebató las Islas del Hierro, y Cersei Lannister ha encontrado en él un aliado dispuesto a poner sus naves y su crueldad a su servicio.\n\nLa causa de Daenerys ofrece una oportunidad para recuperar lo que te pertenece y destruir a quienes se interponen en tu camino. Mientras el dragón desafía al león, los krakens volverán a surcar el mar.\n\n#bold Lo que está muerto no puede morir.#!"
 atfw_bookmark_intro.0004.a:0 "Recuperaré las Islas del Hierro."

 atfw_bookmark_intro.0005.desc:0 "La hija del Rey Loco ha regresado. Daenerys Targaryen ha cruzado el mar Angosto, ha tomado Rocadragón y ha traído consigo dragones, ejércitos extranjeros y aliados dispuestos a arrancarte la corona. Dorne y el Dominio ya han levantado sus estandartes en su nombre.\n\nPero tú ocupas el Trono de Hierro. Desembarco del Rey es tuyo, y la Casa Lannister no ha sobrevivido hasta hoy inclinando la cabeza ante sus enemigos. Si la hija de Aerys desea una corona, tendrá que venir a buscarla.\n\n#bold El dragón ha vuelto, y viene por tu trono.#!"
 atfw_bookmark_intro.0005.a:0 "Que venga."

 atfw_bookmark_intro.jon.t:0 "La batalla ha terminado"
 atfw_bookmark_intro.0006.desc:0 "Invernalia vuelve a ser tuya. Ramsay Bolton ha muerto, su ejército yace derrotado sobre las nieves que rodean el castillo y el huargo vuelve a ondear sobre las murallas del hogar de tu padre.

Pero la victoria no ha traído la paz. El Norte está exhausto, viejas heridas dividen a sus casas y, más allá del Muro, aguarda un enemigo que la mayoría jamás ha visto. Antes de decidir qué vendrá después, los señores que sangraron por Invernalia —y aquellos que no lo hicieron— deberán reunirse bajo un mismo techo.

#bold La batalla ha terminado. Ahora el Norte debe decidir qué hacer.#!"
 atfw_bookmark_intro.0006.a:0 "Convocaré a todos los estandartes en Invernalia."
