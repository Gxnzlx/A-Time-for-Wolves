l_spanish:
 atfw_jon_north.0001.t:0 "El regreso de un lobo"
 atfw_jon_north.0001.desc:0 "Antes de que el primero de los estandartes convocados alcance Invernalia, un nombre familiar comienza a correr de boca en boca por el castillo: Brandon Stark vive.\n\nEl muchacho que desapareció más allá del Muro ha regresado, aunque queda poco del hermano que recuerdas. Bran habla en voz baja, casi distante, de cosas que ningún cuervo podría haberle contado y de recuerdos pertenecientes a hombres muertos hace mucho. Meera Reed lo ha traído a través de peligros que apenas puedes imaginar.\n\nPor primera vez desde que recuperaste Invernalia, parece que uno de los muertos te ha sido devuelto."
 atfw_jon_north.0001.a:0 "Bran... estás en casa."

 atfw_jon_north.0002.t:0 "Nadie vuelve a casa"
 atfw_jon_north.0002.desc:0 "Apenas ha tenido tiempo de asentarse en Invernalia la noticia del regreso de Bran cuando otro jinete cruza sus puertas.\n\nArya.\n\nLa niña que recuerdas ha desaparecido. La joven que tienes ante ti se mueve como una hoja oculta bajo una capa, y hay algo en sus ojos que habla de caminos mucho más oscuros que cualquiera que hayas recorrido con la Guardia. Pero cuando contempla las murallas de Invernalia, por un instante vuelve a ser tu hermana.\n\nUno a uno, los lobos encuentran el camino de regreso a casa."
 atfw_jon_north.0002.a:0 "Te has tomado tu tiempo."

 atfw_jon_north.0003.t:0 "El Rey en el Norte"
 atfw_jon_north.0003.desc:0 "El gran salón de Invernalia está abarrotado desde los hogares hasta las puertas. Señores, damas, jefes de clan y capitanes ocupan los bancos mientras las copas pasan de mano en mano. Casi podría parecer un festín, de no ser por tantos asientos vacíos que ha dejado la guerra.\n\nLas voces se alzan entre viejos agravios: los salvajes, los Bolton, los reyes del Sur, las casas que respondieron al llamado y aquellas que no lo hicieron. Entonces una voz se impone sobre todas las demás. Otra la sigue. Las espadas golpean las mesas. Los puños martillean los escudos.\n\n#bold «¡El Rey en el Norte!»#!\n\nEl grito se extiende hasta que las propias vigas parecen devolverlo. No están proclamando a un Stark por su nacimiento. Te proclaman porque te han elegido."
 atfw_jon_north.0003.a:0 "El Norte recuerda."

 atfw_jon_north.0004.t:0 "La guerra que importa"
 atfw_jon_north.0004.desc:0 "Dejas que los vítores se apaguen antes de volver a hablar.\n\nLa corona que te han entregado no significará nada si los muertos cruzan el Muro. Les cuentas lo que viste en Casa Austera: cadáveres levantándose, ojos azules abriéndose en la oscuridad, un ejército que crece con cada hombre al que mata. Necesitáis hombres, fortalezas sólidas y armas capaces de matar a los Otros.\n\nY necesitáis vidriagón.\n\nLos cuervos traen noticias de que Daenerys Targaryen ha desembarcado en Rocadragón, la isla bajo la cual, según se dice, existen grandes vetas de vidriagón. También posee dragones: fuego viviente contra los muertos.\n\nAl salón no le agrada que su nuevo rey cabalgue hacia el Sur para encontrarse con otra reina. A ti tampoco. Pero no aceptaste su corona para ignorar al enemigo que se aproxima."
 atfw_jon_north.0004.a:0 "Iré a Rocadragón."

 atfw_jon_north.0005.t:0 "Un nombre enterrado en la nieve"
 atfw_jon_north.0005.desc:0 "Antes de que puedas partir, Bran pide que unos pocos os reunáis en privado. Sansa llega primero. Samwell Tarly trae consigo lo que ha descubierto entre los registros de la Ciudadela. Howland Reed, el último hombre vivo que acompañó a tu padre hasta la Torre de la Alegría, permanece junto a su hija Meera.\n\nBran relata lo que ha visto. Sam aporta los nombres escritos por maestres muertos. Howland aporta el recuerdo de una promesa pronunciada entre sangre y rosas de invierno.\n\nEddard Stark nunca fue tu padre.\n\nLyanna Stark fue tu madre. Rhaegar Targaryen fue tu padre.\n\nLa verdad debería cambiarlo todo. Sin embargo, solo puedes pensar en el hombre que te crio, en la familia que te llamó hermano y en un reino que ya se sostiene al borde de la guerra. Si esto llega a saberse, todos los señores de Poniente encontrarán un uso para tu sangre."
 atfw_jon_north.0005.a:0 "Nadie más debe saberlo. Todavía no."

 atfw_jon_north.0006.t:0 "Hacia el Sur"
 atfw_jon_north.0006.desc:0 "Al llegar la mañana, el secreto vuelve a quedar enterrado, aunque sabes que jamás volverás a contemplar tu propio nombre de la misma manera.\n\nEso no cambia nada acerca de los muertos. No cambia nada acerca del vidriagón bajo Rocadragón. Sea cual sea la sangre que corre por tus venas, el Norte espera que lo defiendas.\n\nDavos ha dispuesto los preparativos. El camino hacia el Sur aguarda."
 atfw_jon_north.0006.a:0 "Cabalgamos hacia Rocadragón."
 atfw_jon_north.0007.t:0 "La llamada de los estandartes"
 atfw_jon_north.0007.desc:0 "Los cuervos ya han partido y los caminos hacia Invernalia comienzan a llenarse de hombres bajo colores conocidos. La guerra contra los Bolton ha terminado, pero el Norte aún debe decidir qué vendrá después de la victoria.\n\nNo tomarás esa decisión solo. Cada abanderado que haya sangrado por Invernalia, cada señor que todavía deba su espada a los Stark, tendrá un lugar en el gran salón. Habrá carne y cerveza suficientes para llamarlo festín, aunque nadie confundirá el verdadero motivo de la convocatoria."
 atfw_jon_north.0007.a:0 "Convocad a los estandartes en Invernalia."

 activity_atfw_northern_banners_feast:0 "Festín de los Abanderados del Norte"
 activity_atfw_northern_banners_feast_desc:0 "Jon Snow ha convocado a los señores y capitanes del Norte en Invernalia. Bajo la apariencia de un festín, el reino decidirá qué seguirá a la caída de los Bolton y escuchará hablar de la guerra mucho mayor que se cierne más allá del Muro."
 activity_atfw_northern_banners_feast_province_desc:0 "Los estandartes del Norte se reunirán en el gran salón de Invernalia."
 atfw_jon_north.0008.t:0 "Los estandartes se inclinan"
 atfw_jon_north.0008.desc:0 "Uno tras otro, los señores del Norte se presentan ante la mesa principal. [ROOT.Char.GetTitledFirstName] posa una mano sobre la empuñadura de su espada y se inclina ante [jon.GetTitledFirstName]. Cualquier disputa que haya sobrevivido a la guerra contra los Bolton queda a un lado ante los estandartes reunidos.\n\n#italic «Mi espada es vuestra, Majestad. Mi casa recuerda».#! "
 atfw_jon_north.0008.a:0 "Alzaos. El Norte permanece unido."
 activity_atfw_northern_banners_feast_host_desc:0 "Los estandartes del Norte se han reunido en Invernalia por orden de Jon Snow."
 activity_atfw_northern_banners_feast_guest_desc:0 "Habéis respondido a la convocatoria de Jon Snow y acudido a Invernalia junto a los demás estandartes norteños."
 activity_atfw_northern_banners_feast_conclusion_desc:0 "Los señores del Norte han hablado, el reino ha escogido a su rey y el consejo de guerra ha concluido."

 atfw_jon_daenerys.0001.t: "Hielo y fuego"
 atfw_jon_daenerys.0001.desc: "Rocadragón se alza negra sobre el mar, entre humo, sal y antigua piedra valyria. He venido en busca de vidriagón y de una aliada contra los muertos, no para hincar la rodilla ante una reina sureña.\n\nDaenerys Targaryen aguarda en la Cámara de la Mesa Pintada. Es más joven de lo que hacían pensar las historias, pero no hay incertidumbre alguna en su porte. Rompedora de Cadenas, Madre de Dragones, pretendiente al Trono de Hierro.\n\nSus ojos violetas se posan sobre mí. Por un instante, ni el rey ni la reina dicen palabra."
 atfw_jon_daenerys.0001.a: "Así que esta es la Reina Dragón."

 atfw_jon_daenerys.0002.t: "El Lobo Blanco"
 atfw_jon_daenerys.0002.desc: "Jon Snow no parece un rey de los cantares. No lleva oro, ni sedas, ni corona enjoyada; solo lana oscura, viejas cicatrices y el semblante grave de un hombre que ha visto demasiada muerte.\n\nHa venido a pedirme vidriagón y ayuda contra un enemigo que no puedo ver. No me adula. Peor aún, no me teme.\n\nEsperaba encontrar a otro orgulloso señor norteño. En cambio, me descubro preguntándome qué clase de hombre es aquel a quien su pueblo eligió seguir."
 atfw_jon_daenerys.0002.a: "Escuchemos lo que tiene que decir el Rey en el Norte."

 atfw_jon_daenerys.0003.t: "Un canto entre extraños"
 atfw_jon_daenerys.0003.desc: "Los días de consejos y disputas dan paso a palabras más serenas. Daenerys habla del exilio, de un hermano que vendió sus sueños por una corona y de los reinos que atravesó antes de regresar a casa. Yo hablo del Muro, de los muertos y de un nombre que nunca fue verdaderamente mío.\n\nNinguno de los dos ha deseado casarse. Con demasiada frecuencia el matrimonio no es más que una cadena forjada por manos ajenas. Sin embargo, entre nosotros hay algo que ni el deber ni la diplomacia alcanzan a explicar por completo.\n\nPor primera vez desde mi llegada a Rocadragón, la distancia entre el Norte y el Sur parece un poco menor."
 atfw_jon_daenerys.0003.a: "Quizá no seamos tan distintos."

 atfw_jon_daenerys.0004.t: "Una unión de hielo y fuego"
 atfw_jon_daenerys.0004.desc: "La guerra por los vivos exigirá algo más que ejércitos. El Norte necesita dragones; Daenerys necesita un reino que permanezca a su lado y no bajo sus pies.\n\nLo que comenzó con desconfianza se ha convertido en respeto, y el respeto ha dado paso a algo que ninguno de los dos esperaba. Ambos habíamos decidido, cada uno a su manera, que el matrimonio no dictaría nuestro porvenir. Ahora la elección nos pertenece.\n\nUn compromiso entre la última reina Targaryen y el Lobo Blanco uniría nuestras causas ante los dioses y los hombres... y quizá uniría algo más que coronas."
 atfw_jon_daenerys.0004.a: "Que el hielo y el fuego permanezcan unidos."

 atfw_jon_daenerys.0002.b: "No he venido a Poniente para recibir a cada rey que llame a mi puerta."

 atfw_jon_daenerys.0004.b: "No. Nuestra causa no necesita un matrimonio."

 atfw_jon_daenerys.0005.t: "Una puerta cerrada"
 atfw_jon_daenerys.0005.desc: "La respuesta llega antes de que pueda presentarme ante la reina. Daenerys Targaryen no me recibirá. Para ella, la guerra por el Trono de Hierro exige toda su atención, y las historias de muertos que caminan no bastan para apartarla de su propósito.\n\nHe venido al Sur buscando vidriagón y dragones. Por ahora, solo he encontrado una puerta cerrada."
 atfw_jon_daenerys.0005.a: "Tendremos que encontrar otro camino."

 atfw_jon_daenerys.0006.t: "Dos coronas, dos caminos"
 atfw_jon_daenerys.0006.desc: "Daenerys escucha la propuesta hasta el final, pero su respuesta es clara. Puede haber respeto entre nosotros, incluso amistad, pero no entregará su futuro a un compromiso. La alianza que imaginé no será sellada ante los dioses ni ante los hombres.\n\nEl hielo y el fuego han encontrado una causa común, pero no una unión."
 atfw_jon_daenerys.0006.a: "Entonces lucharemos como aliados, no como esposos."

 activity_atfw_journey_to_dragonstone:0 "Viaje a Rocadragón"
 activity_atfw_journey_to_dragonstone_host_an_a:0 "$host_activity_a$"
 activity_atfw_journey_to_dragonstone_desc:0 "Los muertos marchan, y Rocadragón guarda tanto el vidriagón como a la reina dragón cuya ayuda podría necesitar el Norte. Debo viajar al Sur y conocer a Daenerys Targaryen en persona."
 activity_atfw_journey_to_dragonstone_destination_selection:0 "Rocadragón es el único destino de este viaje."
 activity_atfw_journey_to_dragonstone_selection_tooltip:0 "Viaja a Rocadragón para solicitar una audiencia con Daenerys Targaryen. El encuentro comenzará únicamente cuando Jon llegue físicamente allí."
 activity_atfw_journey_to_dragonstone_host_desc:0 "Viaja a Rocadragón y solicita una audiencia con Daenerys Targaryen."
 activity_atfw_journey_to_dragonstone_guest_desc:0 "No se invita a ningún acompañante a este viaje."
 activity_atfw_journey_to_dragonstone_guest_help_text:0 "$activity_atfw_journey_to_dragonstone$"
 activity_atfw_journey_to_dragonstone_province_desc:0 "Viaja a Rocadragón y busca audiencia con la reina dragón."
 activity_atfw_journey_to_dragonstone_conclusion_desc:0 "Jon ha llegado a Rocadragón."
 activity_atfw_journey_to_dragonstone_predicted_cost:0 "Este viaje no tiene un coste de actividad; solo se aplican los riesgos y la logística normales del viaje."
 atfw_journey_to_dragonstone_phase:0 "Llegada a Rocadragón"
 atfw_journey_to_dragonstone_phase_desc:0 "Jon viaja hasta Rocadragón para solicitar una audiencia con Daenerys Targaryen."
 TRAVEL_NAME_FOR_activity_atfw_journey_to_dragonstone:0 "Viaje de Jon a Rocadragón"
