 atfw_journey_to_dragonstone_phase:0 "Estancia en Rocadragón"
 atfw_journey_to_dragonstone_phase_desc:0 "Jon llega a Rocadragón y trata de convencer a Daenerys de que la guerra contra los muertos es real."
 TRAVEL_NAME_FOR_activity_atfw_journey_to_dragonstone:0 "Viaje de Jon a Rocadragón"
 atfw_jon_north.0013.t:0 "El Norte en sus manos"
 atfw_jon_north.0013.desc:0 "La decisión de partir hacia Rocadragón está tomada, pero un rey no puede abandonar su reino sin dejar a alguien que hable con su voz. Ante Davos y los señores reunidos, llamas a Sansa a tu lado.\n\nMientras estés lejos, ella gobernará Invernalia, escuchará a los vasallos y mantendrá unido el Norte. Le confías el reino porque es una Stark y porque es tu hermana."
 atfw_jon_north.0013.a:0 "Mientras esté ausente, el Norte queda en tus manos."
 atfw_sansa_north.0006.t:0 "La señora de Invernalia"
 atfw_sansa_north.0006.desc:0 "Jon está lejos, pero los cuervos no dejan de llegar. Hay graneros que llenar, hombres que enviar al Muro, disputas que resolver y fortalezas que preparar. Bran ha regresado, aunque ya no es el muchacho que recuerdas.\n\nJon lleva la corona; durante su ausencia, eres tú quien debe impedir que el Norte se deshaga."
 atfw_sansa_north.0006.a:0 "Invernalia no quedará desatendida."
 atfw_sansa_north.0007.t:0 "Tres lobos bajo un mismo techo"
 atfw_sansa_north.0007.desc:0 "Por primera vez desde que vuestra familia fue dispersada, tú, Arya y Bran estáis nuevamente bajo el techo de Invernalia. Arya ha regresado cambiada; Bran parece vivir entre el presente y recuerdos que no son suyos. Jon, que debería estar aquí para verlo, se encuentra lejos buscando dragones y vidriagón.\n\nAun así, por un momento, Invernalia vuelve a albergar a los hijos de Ned Stark."
 atfw_sansa_north.0007.a:0 "Ojalá Jon pudiera ver esto."
 atfw_jon_north.0014.t:0 "La reina llega al Norte"
 atfw_jon_north.0014.desc:0 "Las murallas de Invernalia aparecen entre la nieve. Regresas al hogar que dejaste meses atrás, pero ya no vuelves solo. Daenerys Targaryen cabalga contigo y dragones vuelan sobre el Norte.\n\nSansa ha gobernado en tu ausencia. Bran y Arya han regresado. Tu vuelta pone fin a la regencia, pero apenas cruzas las puertas queda claro que tu familia lleva tiempo esperando poder contarte algo."
 atfw_jon_north.0014.a:0 "Estoy en casa."
 atfw_jon_daenerys.0021.t:0 "Sin coronas entre nosotros"
 atfw_jon_daenerys.0021.desc:0 "El mar se extiende oscuro tras los ventanales mientras el barco avanza hacia el Norte. Jon ha acudido a tus aposentos sin escoltas, sin consejeros y sin una corona que interponer entre ambos.\n\nDesde Rocadragón habéis discutido, luchado y aprendido a confiar el uno en el otro. Lo viste arriesgar la vida más allá del Muro, y por un instante creíste que no regresaría. Ahora está ante ti, vivo, y ninguno de los dos parece dispuesto a seguir fingiendo que lo que existe entre vosotros es solamente una alianza.\n\nCuando la puerta se cierra, dejas atrás por una noche a la reina que pretende el Trono de Hierro. Él deja atrás al Rey en el Norte. Solo quedan Daenerys y Jon."
 atfw_jon_daenerys.0021.a:0 "Esta noche, que solo seamos nosotros."

 atfw_jon_daenerys.0022.t:0 "El dragón verde"

 atfw_jon_daenerys.0022.desc:0 "Rhaegal te observa desde la nieve, inmóvil salvo por el vapor que escapa de sus fauces. Ya habías estado cerca de los dragones de Daenerys, incluso habías sentido las escamas de Drogon bajo tu mano, pero nunca habías imaginado encontrarte frente a uno de ellos de esta manera.\n\nAvanzas con cautela. Rhaegal no ruge ni retrocede. Sus ojos permanecen fijos en ti mientras acortas la distancia y, cuando extiendes una mano, el enorme dragón baja lentamente la cabeza hasta permitir que tus dedos descansen sobre sus escamas.\n\nMiras a Daenerys buscando alguna explicación, pero ella parece tan sorprendida como tú. No sabes por qué Rhaegal te permite acercarte ni qué espera de ti. Entonces el dragón se inclina ante ti, ofreciéndote su lomo.\n\nHas montado caballos desde que eras un niño, pero nada podría haberte preparado para esto. Aun así, reúnes el valor para subir. Rhaegal no se resiste. Bajo tus manos sientes cómo su cuerpo se tensa y, un instante después, sus enormes alas se despliegan sobre la nieve.\n\nPor los dioses... vas a volar sobre un dragón."

 atfw_jon_daenerys.0022.a:0 "Bueno... ya he llegado hasta aquí."

 atfw_jon_daenerys.0023.t:0 "Rhaegal lo ha elegido"

 atfw_jon_daenerys.0023.desc:0 "Has visto a hombres acercarse a tus dragones con miedo, arrogancia o una temeridad nacida de la ignorancia. Jon Nieve no hace ninguna de esas cosas.\n\nRhaegal lo observa mientras se aproxima. No ruge ni retrocede. Inclina la cabeza hacia su mano y permite que lo toque. Entonces Jon monta sobre su lomo y el dragón verde abre las alas, alzándose sobre la nieve con el Rey en el Norte sobre su espalda.\n\nDurante unos instantes, solo puedes contemplarlos en silencio.\n\nJon no es un Targaryen. No tiene sangre valyria que tú conozcas, ni pertenece a ninguna estirpe de jinetes de dragón. Desde los tiempos de Ortigas, durante la Danza de los Dragones, no recuerdas haber oído de alguien ajeno a tu sangre que lograra algo semejante. Drogon ya había tolerado su presencia en Rocadragón, pero esto es distinto. Rhaegal no se limita a aceptarlo cerca de él: lo ha escogido como jinete.\n\nJon vuelve la mirada hacia ti desde el lomo del dragón. Todavía no comprendes qué significa lo que acabas de presenciar, pero no puedes evitar sonreír."

 atfw_jon_daenerys.0023.a:0 "Entonces volemos juntos."

 atfw_jon_daenerys.0024.t:0 "Sobre alas de dragón"
 atfw_jon_daenerys.0024.desc:0 "Rhaegal se lanza al cielo y el suelo desaparece bajo ti. El viento golpea tu rostro mientras Invernalia se hace pequeña entre la nieve y los bosques del Norte se extienden hasta perderse en el horizonte.\n\nUn rugido retumba a tu lado. Daenerys vuela sobre Drogon y, por primera vez desde que la conociste, no hay una mesa, una guerra ni una corona entre vosotros. Solo dos dragones cruzando el cielo y la mujer que ha llegado a significar mucho más de lo que esperabas cuando partiste hacia Rocadragón.\n\nRhaegal se inclina hacia Drogon y ambos vuelan juntos sobre las tierras heladas. Daenerys vuelve el rostro hacia ti. Está riendo.\n\nNo recuerdas la última vez que la viste tan libre."
 atfw_jon_daenerys.0024.a:0 "No te quedes atrás."

 atfw_jon_daenerys.0025.t:0 "Donde no alcanzan las coronas"
 atfw_jon_daenerys.0025.desc:0 "Drogon y Rhaegal vuelan lado a lado sobre el Norte. Abajo quedan Invernalia, los ejércitos y todos aquellos que esperan algo de vosotros. Aquí arriba no hay Trono de Hierro ni Rey en el Norte.\n\nJon ya no es el extraño que llegó a Rocadragón negándose a doblar la rodilla. Lo has visto enfrentarse a los muertos, arriesgar la vida por sus hombres y mantener su palabra incluso cuando mentir habría sido más fácil. Ahora vuela junto a ti sobre Rhaegal como si hubiera pertenecido al cielo desde siempre.\n\nCuando ambos dragones descienden lejos de las miradas de la corte, Jon se acerca. Esta vez no hay deber que pueda explicar lo que sientes ni alianza que lo haga necesario.\n\nPodrías permitir que siga siendo solamente un amante. Pero sabes que ya hace tiempo que dejó de ser solamente eso."
 atfw_jon_daenerys.0025.a:0 "Quiero que esto sea algo más."

 atfw_jon_daenerys.0018.t:0 "Sangre, amor y corona"
 atfw_jon_daenerys.0018.desc:0 "La verdad cambia tu nombre, pero no lo que sientes por Daenerys. Eres hijo legítimo de Rhaegar Targaryen y Lyanna Stark, y tu nacimiento crea una pretensión que amenaza a la mujer a la que juraste lealtad.\n\nExiste otra posibilidad: unir ambas pretensiones mediante matrimonio. No como una alianza decidida antes de conoceros, sino como una elección nacida de todo lo ocurrido desde Rocadragón."
 atfw_jon_daenerys.0018.a:0 "Le propondré que unamos nuestras casas."
 atfw_jon_daenerys.0018.b:0 "No convertiré lo nuestro en una cuestión de coronas."

 atfw_jon_daenerys.0019.t:0 "El último dragón"
 atfw_jon_daenerys.0019.desc:0 "Las palabras de Jon tardan un instante en cobrar sentido. Lyanna Stark fue su madre, pero Eddard Stark nunca fue su padre. Su verdadero padre fue Rhaegar Targaryen, tu hermano.\n\nRhaegar y Lyanna se casaron en secreto antes de que Jon naciera. No es Jon Nieve. Nunca fue un bastardo. Su verdadero nombre es Aegon Targaryen.\n\nDe pronto recuerdas a Rhaegal inclinando la cabeza ante él, permitiéndole montar sobre su lomo como si aquello fuese lo más natural del mundo. El dragón que lleva el nombre de Rhaegar había reconocido en su hijo aquello que ninguno de vosotros podía ver.\n\nJon es sangre de tu sangre. Tu sobrino. Y, como hijo legítimo de Rhaegar, posee una pretensión al Trono de Hierro incluso mayor que la tuya.\n\nPero Jon no ha venido a reclamarte una corona. Te habla del vínculo que habéis forjado y de una posibilidad que hasta ahora ninguno de los dos podía imaginar: unir las dos últimas ramas de la Casa Targaryen y gobernar juntos."
 atfw_jon_daenerys.0019.a:0 "Entonces que el hielo y el fuego permanezcan unidos."
 atfw_jon_daenerys.0019.b:0 "Lo que siento por ti no puede resolver esta disputa."

 atfw_jon_daenerys.0020.t:0 "La verdad entre nosotros"
 atfw_jon_daenerys.0020.desc:0 "Apenas has tenido tiempo de comprender lo que Sam y Bran te han revelado, pero hay alguien que debe conocer la verdad por tus propios labios. Después de todo lo que ha ocurrido entre vosotros, no puedes ocultársela a Daenerys.\n\nLe cuentas que Eddard Stark nunca fue tu padre, sino el hombre que te protegió y te crio como a un hijo. Tu madre fue Lyanna Stark y tu verdadero padre, Rhaegar Targaryen. Se casaron en secreto antes de tu nacimiento, y el nombre que te dieron no fue Jon Nieve, sino Aegon Targaryen.\n\nMientras pronuncias esas palabras, piensas en Rhaegal. En cómo inclinó la cabeza ante ti, en cómo te permitió subir sobre su lomo y alzar el vuelo junto a Daenerys. Lo que entonces parecía imposible adquiere ahora un significado que jamás habrías imaginado.\n\nDaenerys guarda silencio. Sabes lo que esta verdad significa para ella. Eres hijo legítimo de Rhaegar y, por tanto, tienes una pretensión al Trono de Hierro mayor que la suya. Pero la corona no es la razón por la que has venido a hablar con ella.\n\nNo quieres que un nombre que acabas de descubrir destruya aquello que ambos habéis encontrado juntos."

 atfw_jon_daenerys.0020.a:0 "Ya no habrá secretos entre nosotros."