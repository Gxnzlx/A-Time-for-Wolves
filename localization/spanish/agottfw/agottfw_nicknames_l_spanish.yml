l_spanish:
 nick_the_incredibly_old_one: "El Increíblemente Anciano"
 nick_the_big_fat_one: "El Gran Gordo"

 nick_redwolf: "Loborrojo"

 nick_halfmaester: "Mediomaestre"
 nick_halfmaester_desc: "Haldon, llamado Mediomaestre, estudió en la Ciudadela de Antigua, pero no obtuvo suficientes eslabones para convertirse en maestre."

 nick_griff: "Griff"
 nick_griff_desc: "Lord Jon Connington, Mano del Verdadero Rey, pasó gran parte de su exilio oculto bajo la identidad del mercenario Griff. Durante esos años crió y protegió al joven hijo de su más querido amigo. Jon le falló al padre, pero no le fallará al hijo."

 nick_griff_victorius: "Lord Griff"
 nick_griff_victorius_desc: "Lord Jon Connington, Señor restituido del Nido del Grifo y Mano del Rey, pasó gran parte de su exilio oculto bajo la identidad del mercenario Griff. Durante esos años crió y protegió al joven que creía hijo de su más querido amigo. Cuando la verdad finalmente salió a la luz, el señor exiliado tuvo que tomar una decisión. Al final, eligió permanecer junto a su pupilo. Porque, negro o rojo, un dragón sigue siendo un dragón."

 nick_duck: "Pato"
 nick_duck_desc: "Ser Rolly Campodepatos, conocido como «Pato», fue un herrero de humilde cuna al servicio de la Compañía Dorada que soñaba con el día en que sería nombrado caballero. Cuando el mercenario conocido como Griff le encomendó entrenar a su hijo, Rolly cumplió con su deber fielmente. Con el tiempo, el herrero se convirtió en caballero, y su pupilo, en un dragón."

 nick_duck_victorius: "Pato"
 nick_duck_victorius_desc: "Ser Rolly Campodepatos, conocido como «Pato», fue un herrero de humilde cuna al servicio de la Compañía Dorada que soñaba con el día en que sería nombrado caballero. Cuando el mercenario conocido como Griff le encomendó entrenar a su hijo, Rolly cumplió con su deber fielmente. Con el tiempo, el herrero se convirtió en caballero, y su pupilo, en un dragón. Hoy viste el blanco de la Guardia Real y sirve a su rey con la misma lealtad que lo llevó hasta allí."

 nick_aegon_griff: "Griff el Joven"
 nick_aegon_griff_desc: "Aegon Targaryen, hijo del príncipe Rhaegar y Elia de Dorne, fue criado en el exilio bajo la tutela del mercenario Griff, identidad tras la cual se ocultaba Lord Jon Connington, el más fiel amigo de su padre. Preparado desde niño para gobernar, creció entre pescadores y el pueblo llano. Además de recibir entrenamiento en las armas, fue instruido en historia, leyes y los misterios de la Fe, pues se le enseñó que un rey no gobierna por derecho, sino por deber."

 nick_aegon_dragon: "el Dragón"
 nick_aegon_dragon_desc: "Aegon, quien durante toda su vida creyó ser hijo del príncipe Rhaegar y Elia de Dorne, fue criado en el exilio por Lord Jon Connington. Preparado desde niño para reinar, aprendió que un rey no gobierna por derecho, sino por deber. Cuando la verdad sobre su origen finalmente salió a la luz, Aegon Fuegoscuro reunió sus fuerzas y llevó a los exiliados a Poniente, porque, negro o rojo, un dragón sigue siendo un dragón."
