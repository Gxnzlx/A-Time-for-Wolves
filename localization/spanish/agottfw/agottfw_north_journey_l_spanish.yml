l_spanish:
 atfw_north_journey.0001.t:0 "El camino que compartiremos"
 atfw_north_journey.0001.desc:0 "Habéis prometido enfrentaros juntos a los muertos. Jon propone navegar contigo hasta Puerto Blanco y continuar por tierra hacia Invernalia. Llegar a su lado puede hacer más por ganarse la confianza del Norte que cualquier estandarte. Eliges el barco en vez de viajar sola sobre Drogon."
 atfw_north_journey.0001.a:0 "Iremos juntos al Norte."
 atfw_north_journey.0002.t:0 "Juntos a Invernalia"
 atfw_north_journey.0002.desc:0 "Daenerys acepta navegar contigo. En Puerto Blanco tomaréis el camino al norte, y tu pueblo verá a la reina junto al hombre que pidió su ayuda. Por primera vez, volver a casa significa llevar contigo a alguien cuyo lugar en tu vida aún no sabes nombrar."
 atfw_north_journey.0002.a:0 "Entonces preparémonos."
 atfw_north_journey.0003.t:0 "Preparados para zarpar"
 atfw_north_journey.0003.desc:0 "El viaje al Norte está acordado. Jon y tú partiréis de Rocadragón en el mismo grupo de viaje, con Invernalia como destino final. Prepara la ruta. Si alguno está ocupado en otro viaje, la decisión de reanudar esta expedición seguirá disponible cuando ambos estéis libres."
 atfw_north_journey.0003.a:0 "Preparar nuestra ruta."
 atfw_north_journey.0004.t:0 "Puerto Blanco"
 atfw_north_journey.0004.desc:0 "El barco llega a Puerto Blanco. Lo que comenzó entre Jon y tú a bordo os acompaña ahora a una tierra que apenas conoce de ti más que tu apellido. Invernalia aún queda tierra adentro. Juntos, os preparáis para tomar el camino hacia su hogar."
 atfw_north_journey.0004.a:0 "Ahora, el camino a Invernalia."
 atfw_north_journey.0006.t:0 "Una reina en el Norte"
 atfw_north_journey.0006.desc:0 "Invernalia se alza ante ti. Jon ha regresado con su familia y tú has venido con él; tus soldados y dragones atraen las miradas recelosas de los norteños. Sansa te recibe con cortesía formal. Reconoces la distancia que se esconde bajo ella. Ser bienvenida junto a Jon no equivale a ser aceptada por su pueblo."
 atfw_north_journey.0006.a:0 "Hemos venido a luchar a vuestro lado."
 atfw_north_journey.0007.t:0 "Huéspedes, soldados y dragones"
 atfw_north_journey.0007.desc:0 "Jon está en casa, pero no ha vuelto solo. Daenerys permanece a su lado mientras un ejército se reúne ante tus murallas. Ofreces la bienvenida que tu casa debe a un huésped. Tras esa cortesía aguardan preguntas sobre los alimentos, el mando y el futuro del Norte. Habrá que responderlas, aunque hoy tu hermano prefiera abrazar a su familia."
 atfw_north_journey.0007.a:0 "Invernalia os recibe."
 atfw_resume_north_journey:0 "Continuar el viaje al Norte"
 atfw_resume_north_journey_desc:0 "Continúa con Jon hasta Invernalia desde el lugar donde os encontráis."
 atfw_resume_north_journey_tooltip:0 "Reanudar el viaje conjunto."
 atfw_resume_north_journey_confirm:0 "Partir hacia Invernalia"
 atfw_resume_winterfell_story:0 "Continuar la historia en Invernalia"
 atfw_resume_winterfell_story_desc:0 "Retoma el siguiente encuentro pendiente de Jon y Daenerys. Úsalo si la secuencia de una partida anterior se ha detenido; espera a responder los eventos abiertos antes de continuar."
 atfw_resume_winterfell_story_tooltip:0 "Retomar el siguiente encuentro pendiente."
 atfw_resume_winterfell_story_confirm:0 "Continuar"
