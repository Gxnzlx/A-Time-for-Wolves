l_spanish:
 atfw_highgarden.0002.t:0 "La caída de Altojardín"
 atfw_highgarden.0002.desc:0 "Altojardín ha caído ante el ejército Lannister. Olenna permaneció en la fortaleza y ha sido ejecutada; los Tyrell que no estaban protegidos tampoco han sido perdonados.\n\nLeo Tyrell y los supervivientes han formado un campamento en el exilio. Randyll Tarly recibe Altojardín y el Dominio bajo la autoridad de Cersei."
 atfw_highgarden.0002.fled:0 "Altojardín ha sido abandonado y ha caído en manos Lannister. Olenna logró huir con los Tyrell protegidos y encabeza ahora a las Rosas del Exilio.\n\nRandyll Tarly recibe Altojardín y el Dominio bajo la autoridad de Cersei. Hemos perdido una fortaleza, pero Olenna sigue viva."
 atfw_highgarden.0002.a:0 "Los leones responderán por esto."
 atfw_highgarden.0003.t:0 "Un mes en Rocadragón"
 atfw_highgarden.0003.desc:0 "Ha pasado un mes desde mi llegada a Rocadragón. La guerra del sur sigue ocupando a esta corte, pero no puedo seguir esperando.\n\nDebo hablar con Daenerys. Los muertos no concederán al Norte una tregua."
 atfw_highgarden.0003.a:0 "Es hora de hablar con la reina."
 atfw_highgarden.0004.t:0 "El asedio de Altojardín"
 atfw_highgarden.0004.desc:0 "Treinta mil soldados Lannister se han presentado ante Altojardín. Preparan sus máquinas de asedio y rodean nuestras defensas.\n\nAún puedo escapar con los miembros de nuestra familia que he decidido proteger. Abandonaría mis tierras para encabezar un campamento de aventureros en Lanza del Sol.\n\nSi me quedo, Leo conducirá a los supervivientes al exilio mientras intento defender la fortaleza. Si los leones la conquistan, me ejecutarán."
 atfw_highgarden.0004.stay:0 "Me quedaré. Leo pondrá a nuestra familia a salvo."
 atfw_highgarden.0004.flee:0 "Huiremos juntos. Aún no es nuestro final."
 atfw_highgarden.0005.t:0 "La caída de Altojardín"
 atfw_highgarden.0005.desc:0 "El ejército ha conquistado Altojardín. Olenna se quedó y ha pagado con su vida, junto con los Tyrell que no escaparon a la sentencia.\n\nLeo y los supervivientes han formado un campamento en el exilio. Randyll Tarly recibe Altojardín y el Dominio en mi nombre."
 atfw_highgarden.0005.fled:0 "Olenna abandonó Altojardín y huyó con los Tyrell protegidos. Viven ahora en un campamento de aventureros, lejos de las tierras que han perdido.\n\nRandyll Tarly recibe Altojardín y el Dominio en mi nombre. La vieja espina ha escapado, pero su fortaleza es nuestra."
 atfw_highgarden.0005.a:0 "Oye mi rugido."
 atfw_highgarden.0007.t:0 "La última rosa de Altojardín"
 atfw_highgarden.0007.desc:0 "Las defensas han cedido. Los Lannister han conquistado Altojardín y mis esfuerzos por resistir han llegado a su fin.\n\nLeo y los Tyrell protegidos ya están lejos. Mi decisión les ha dado una oportunidad, pero para mí ya no habrá huida. Los vencedores han dictado mi sentencia."
 atfw_highgarden.0007.a:0 "No me verán suplicar."
 atfw_highgarden.stay_tt:0 "Permaneces en Altojardín. Leo Tyrell liderará a los once Tyrell protegidos en un campamento de aventureros. Solo morirás por esta cadena si los Lannister conquistan la fortaleza."
 atfw_highgarden.flee_tt:0 "Abandonas tus títulos territoriales y formas el campamento de aventureros «Las Rosas del Exilio» con los once Tyrell protegidos. Altojardín cae y el Dominio pasa a Randyll."
 atfw_highgarden.death_tt:0 "Olenna será ejecutada. Su partida puede terminar si no dispone de una sucesión jugable."
 atfw_highgarden_exiles_title:0 "Las Rosas del Exilio"
 atfw_highgarden_lannister_host:0 "Ejército Lannister de Altojardín"
