l_spanish:
 decision_in_major_port: "Estás en una gran ciudad portuaria"
 sail_into_west_decision: "Navegar hacia el Oeste"
 sail_into_west_decision_desc: "Embárcate en un gran viaje hacia el ocaso para descubrir qué hay al oeste de Poniente."
 sail_into_west_decision_effect: "Comienzas los preparativos para abordar un gran barco y poner rumbo a lo desconocido."
 sail_into_west_decision_tooltip: "Zarpar hacia el Mar del Ocaso"
 sail_into_west_decision_confirm: "¡Comenzar los preparativos!"
 bookmark.tfw.t: "Preparando el Gran Viaje"
 bookmark.tfw.desc_intro: "Hace siglos, Elissa Farman robó un nido de huevos de dragón de Rocadragón para financiar la construcción de un gran barco. Su plan: un gran viaje hacia el Oeste. \n\nNadie sabe qué le ocurrió, salvo que jamás regresó. ¿Serás el primero en averiguarlo?"
 bookmark.tfw.a: "¡Es hora de encontrar un barco!"
 bookmark.tfw.a.tt: "Buscas en el puerto un barco alto y una tripulación valiente."
 bookmark.tfw.b: "Todavía no..."
 bookmark.tfw.b.tt: "¡Tu familia se sentirá aliviada!"
 bookmark.tfw.desc_2: "Han pasado unos días, pero por fin has logrado encontrar un Capitán dispuesto a hacer el viaje. Si todo sale como se espera, el barco zarpa mañana del puerto. \n\nEsta es tu última oportunidad para echarte atrás..."
 bookmark.tfw.c: "¡Veamos qué hay ahí fuera!"
 bookmark.tfw.c.tt: "El barco navega hacia el oeste."
 bookmark.tfw.d: "Hoy no..."
 bookmark.tfw.d.tt: "Abandonas tus planes y te quedas en tierra firme."
 bookmark.tfw.desc_3: "Miras hacia el horizonte y te das cuenta de que hoy algo es diferente... \n\n¡Has perdido de vista la tierra! \n\nPocos han navegado jamás tan lejos hacia el oeste, pero tu Gran Viaje apenas está comenzando..."
 bookmark.tfw.e: "¡Adelante hacia el ocaso!"
 bookmark.tfw.e.tt: "Desapareces más allá del mar, para no ser visto jamás."

 res_dany_decision: "Resucitar a la Verdadera Reina"
 res_dany_decision_desc: "Trabaja con tu Sacerdote Rojo para devolver la vida al cadáver de Daenerys Targaryen, la última Reina legítima de Poniente. \n\nCualquier petición hecha al Señor de Luz tiene más posibilidades de cumplirse con un sacrificio. La sangre de rey demostró su poder durante la Guerra de los Cinco Reyes."
 res_dany_decision_effect_0: "Tus posibilidades de éxito dependen de tu devoción a R'hllor, la habilidad de tu Sacerdote Rojo y el valor de tu sacrificio."
 res_dany_decision_tooltip: "Intentar resucitar a Daenerys Targaryen."
 res_dany_decision_confirm: "¡Encended las hogueras nocturnas!"
 res_dany_cooldown_text: "#bold NO#! has tomado esta decisión en el último año"

 tfw_look_into_flames.0001.prisoner: "¡La sangre de rey posee un gran poder!"
 tfw_look_into_flames.0001.prisoner.tt: "¡Esto sin duda me ganará el favor del Señor de Luz!"
 tfw_look_into_flames.0001.peasants: "Un sacrificio de gente común será suficiente."
 tfw_look_into_flames.0001.peasants.tt: "Esto probablemente será suficiente para R'hllor."
 tfw_look_into_flames.0001.false_idols: "Quemar los falsos dioses."
 tfw_look_into_flames.0001.false_idols.tt: "Quemar ídolos falsos seguramente me ganará el favor del Señor..."
 tfw_look_into_flames.0001.a: "No haré ninguna ofrenda salvo mis plegarias."
 tfw_look_into_flames.0001.a.tt: "El Dios Rojo suele exigir sacrificios..."
 tfw_look_into_flames.0001.b: "El momento no es el adecuado."

 agot_tfw_dany.0001.t: "¿El regreso de la Reina?"
 agot_tfw_dany.0001.desc: "Se dice que R'hllor habla a sus elegidos a través del fuego bendito, en un lenguaje de cenizas y brasas — un lenguaje difícil de comprender incluso para sus sacerdotes. Observo las hogueras nocturnas y me pregunto, ¿serán respondidas mis plegarias? Mi Sacerdote sugiere que una ofrenda seguramente me ganaría el favor del Señor de Luz, pues al fin y al cabo, solo la muerte puede pagar por la vida. ¿Será suficiente incluso la sangre de rey para pagar por la sangre del Dragón?"
 agot_tfw_dany.0002.t: "La Princesa que fue Prometida"
 agot_tfw_dany.0002.desc: "Los gritos del sacrificio cesaron hace horas, y ahora las llamas comienzan a menguar. No ha ocurrido nada, aunque el cadáver de la Reina permanece intacto. ¿No fue suficiente nuestro trabajo para complacer al Señor de Luz? \n\nSolo queda un sacrificio por hacer. Al igual que Nissa Nissa entregó voluntariamente su vida para forjar Luminaria, caminas hacia las llamas y ofreces tu vida a Azor Ahai renacido."
 agot_tfw_dany.0002.a: "¡¡¡AAAAAAAAGGGGGHHHHHHHH!!!"
 agot_tfw_dany.0002.a.tt: "#bold Continuarás jugando como Daenerys Targaryen  #!#"
 agot_tfw_dany.0002.b: "¡¡¡Padre! ¡¡¡NOOOO!!!"
 agot_tfw_dany.0002.b.tt: "#bold NO #!# cambiarás a Daenerys Targaryen, sino que continuarás como el heredero de tu personaje"
 agot_tfw_dany.0003.t: "Fracaso..."
 agot_tfw_dany.0003.desc: "Los gritos del sacrificio cesaron hace horas, y ahora las llamas comienzan a menguar. No ha ocurrido nada, aunque el cadáver de la Reina permanece intacto."
 tfw_look_into_flames.0003.a: "¿Es siquiera posible?"

