 # A TIME FOR WOLVES FIX MARRIAGE EVENT

 atfw_marriage_events.0001.t: "Viejas Amistades"
 atfw_marriage_events.0001.desc: "Solo ella comprende realmente lo que soy. \n\nCaminó conmigo más allá del Muro. Me cargó cuando yo no podía moverme. Ella y su hermano dieron todo para que yo pudiera convertirme en lo que necesitaba ser... \n\nLa confianza es algo útil, y ahora es la única que queda que lleva consigo este conocimiento."
 atfw_marriage_events.0001.a: "Ella será una reina adecuada. Eso es todo lo que importa."
 atfw_marriage_events.0001.b: "No es necesario. Aún no."

 # Sansa - Harry the Heir 305
 atfw_marriage_events.0002.t: "Las Exigencias del Valle"
 atfw_marriage_events.0002.desc: "Los Señores Reclusadores me presionan para que me case con uno de los suyos como recompensa por la fuerza del Valle.\n\n[Hardyng_5_scope.GetUIName], heredero de mi primo [Arryn_8_scope.GetShortUINameNoTooltip], es joven, apuesto y favorito entre los señores del Valle. Un matrimonio con él uniría el Valle y el Norte."
 atfw_marriage_events.0002.a: "Me casaré con él. Pero [Hardyng_5_scope.GetFirstNameNoTooltip] se unirá a mi casa."
 atfw_marriage_events.0002.b: "No me dejaré comprar."

 # Arya - Gendry
 atfw_marriage_events.0003.t: "Una Cara Familiar"
 atfw_marriage_events.0003.desc: "Mucho ha cambiado desde aquellos días en el Camino Real. Solo éramos niños entonces, huyendo de la guerra, el hambre y la muerte misma.\n\nAhora [Baratheon_9_scope.GetUIName] está ante mí, ya no como aprendiz de herrero, sino como señor por derecho propio. Sin embargo, cuando lo miro, una parte de mí sigue recordando al chico de Flea Bottom."
 atfw_marriage_events.0003.a: "[Baratheon_9_scope.GetUIName] sería un marido adecuado."
 atfw_marriage_events.0003.b: "Mi camino está en otro lugar."

 # Jon Snow - Princess Val
 atfw_marriage_events.0004.t: "El Orgullo del Pueblo Libre"
 atfw_marriage_events.0004.desc: "El Rey Stannis una vez se ofreció a legitimarme en el Muro como un verdadero Stark de Invernalia y casarme con la Princesa Val del Pueblo Libre, para fortalecer una alianza con su gente.\n\nAhora está muerto, y mucho ha ocurrido desde entonces, pero había sabiduría en sus palabras.\n\nAhora vigilo las tierras heladas del Norte, y la Princesa Val tiene ciertos encantos propios."
 atfw_marriage_events.0004.a: "[Rayder_hh_3_scope.GetUIName] sería una esposa adecuada."
 atfw_marriage_events.0004.b: "No es necesario. Todavía no."

 # Sansa - Harry the Heir 304
 atfw_marriage_events.0005.t: "Las Exigencias del Valle"
 atfw_marriage_events.0005.desc: "Los Señores Reclusadores del Valle insisten en que [Stark_Dummy_8_scope.GetUIName] debe casarse con uno de los suyos a cambio de las espadas y lanzas que han prometido.\n\nEl joven [Hardyng_5_scope.GetUIName], heredero de [Arryn_8_scope.GetShortUINameNoTooltip], es la propuesta que presentan. Apuesto, noble y bien visto por los señores del Valle, reforzaría considerablemente nuestros lazos con el Nido de Águilas."
 atfw_marriage_events.0005.a: "Una alianza con el Valle puede valer el precio."
 atfw_marriage_events.0005.b: "[Stark_Dummy_8_scope.GetUIName] elegirá su propio destino."

