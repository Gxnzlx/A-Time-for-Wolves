l_spanish:
 atfw_convoy.0001.t: "Fuego en el Camino de las Rosas"
 atfw_convoy.0001.desc: "Altojardín ha caído y Olenna ha muerto. Al día siguiente, alcanzo con Drogon y los dothraki el convoy que transporta el saqueo del Dominio. Los carros arden y la hueste de Jaime se deshace entre las llamas.\n\nRandyll Tarly se niega a arrodillarse. Dickon permanece a su lado. El hijo afrontará el fuego primero; después lo hará el padre."
 atfw_convoy.0001.a: "Dracarys."
 atfw_convoy.0001.tt: "La hueste del escenario queda destruida. Dickon Tarly muere por fuego de dragón; después muere Randyll Tarly."
