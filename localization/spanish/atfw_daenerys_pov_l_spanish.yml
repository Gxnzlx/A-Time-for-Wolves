l_spanish:
 atfw_daenerys_pov.0001.t: "Un rey que no se arrodilla"
 atfw_daenerys_pov.0001.desc: "Jon Nieve ha rechazado tu exigencia. Habla de los muertos mientras tus enemigos ocupan el trono que construyó tu familia. Sin embargo, ha cruzado el mar para pedir ayuda, y Tyrion te aconseja escucharlo. Permitirle extraer vidriagón te cuesta poco. Quizá así descubras si este rey norteño puede convertirse en un aliado."
 atfw_daenerys_pov.0001.a: "Tendrá su vidriagón. Mi reclamación sigue en pie."
 atfw_daenerys_pov.0002.t: "La advertencia bajo la piedra"
 atfw_daenerys_pov.0002.desc: "Jon te conduce entre las vetas de vidriagón hasta unas figuras grabadas en las paredes. Los Hijos del Bosque y los Primeros Hombres aparecen unidos frente a un enemigo común. Te pide que imagines una guerra anterior a vuestras casas. Aún no estás dispuesta a creer cada palabra, pero empiezas a dudar de la seguridad con que rechazaste su advertencia."
 atfw_daenerys_pov.0002.a: "Cuéntame lo que ha visto tu pueblo."
 atfw_daenerys_pov.0003.t: "Más allá de los títulos"
 atfw_daenerys_pov.0003.desc: "El Rey en el Norte es obstinado, pero empiezas a reconocer algo bajo sus negativas. Habla de las personas que debe proteger más que del poder que podría obtener. Vuestras conversaciones ya no terminan con el primer desacuerdo. Te descubres buscando su opinión, incluso cuando sospechas que su respuesta no te gustará."
 atfw_daenerys_pov.0003.a: "Volveré a escuchar su consejo."
 atfw_daenerys_pov.0004.t: "Drogon le permite acercarse"
 atfw_daenerys_pov.0004.desc: "Observas a Jon ante Drogon. Tiene miedo; sería un necio si no lo tuviera. Pero extiende la mano lentamente y tu dragón le permite apoyarla sobre sus escamas. Has visto a hombres presumir de valor y huir después ante esa mirada. Jon no presume. Por un instante olvidas la respuesta que pensabas exigirle."
 atfw_daenerys_pov.0004.a: "Hay en él más de lo que creía."
 atfw_daenerys_pov.0005.t: "Una prueba peligrosa"
 atfw_daenerys_pov.0005.desc: "El plan parece casi tan imposible como el enemigo que describe Jon: capturar a uno de los muertos y llevarlo al sur para que Cersei lo vea. Tyrion sostiene que esa prueba podría conseguir la tregua que necesitáis. Jon piensa ir en persona. Cuestionas los riesgos como corresponde a una reina, pero tu inquietud persiste cuando ya se han respondido todos tus argumentos."
 atfw_daenerys_pov.0005.a: "Traed la prueba. Y regresad."
 atfw_daenerys_pov.0006.t: "El cuervo de Guardiaoriente"
 atfw_daenerys_pov.0006.desc: "Un cuervo trae noticias: Jon y sus compañeros están atrapados más allá del Muro. Esperar sería lo más prudente para tu campaña, pero cada hora puede costarles la vida. Llamas a tus dragones. Sean cuales sean tus dudas sobre su advertencia, verás a ese enemigo con tus propios ojos. No puedes abandonarlo allí."
 atfw_daenerys_pov.0006.a: "Volamos al norte. Ahora."
 atfw_daenerys_pov.0007.t: "Uno de mis hijos"
 atfw_daenerys_pov.0007.desc: "Viserion ha muerto. No puedes apartar de tu mente su caída ni aquel ejército imposible que rodeaba a Jon y sus compañeros. Esto no es un relato norteño inventado para distraerte del trono. Has pagado la verdad con uno de tus hijos. Mientras aguardas noticias de Jon, el dolor y el miedo apenas dejan espacio para la reina que eras antes."
 atfw_daenerys_pov.0007.a: "Los he visto. Lucharé contra ellos."
 atfw_daenerys_pov.0008.t: "Su reina"
 atfw_daenerys_pov.0008.desc: "Jon está vivo. Junto a su lecho, prometes que lucharéis juntos contra los muertos. Cuando te llama su reina, no hay una corte que aplauda ni un ejército que lo obligue a obedecer. Viniste al norte sin haber obtenido su sumisión. Ahora te la ofrece libremente. Mantienes su mano entre las tuyas un poco más de lo que pretendías."
 atfw_daenerys_pov.0008.a: "Nos enfrentaremos a esto juntos."
 atfw_daenerys_pov.0009.t: "La verdad ante Cersei"
 atfw_daenerys_pov.0009.desc: "Cersei exige la neutralidad del Norte. Una mentira conveniente podría salvar la negociación, pero Jon declara que ya te ha jurado lealtad. Te irrita lo que puede costaros su sinceridad. También te conmueve. Más tarde, lejos de la otra reina y de su corte vigilante, piensas menos en el juramento que en el hombre que no quiso negarlo."
 atfw_daenerys_pov.0009.a: "Sé lo que vale su palabra."
 atfw_daenerys_pov.0010.t: "El hijo de Rhaegar"
 atfw_daenerys_pov.0010.desc: "Encuentras a Jon en las criptas, ante la estatua de Lyanna Stark. Te cuenta que ella y Rhaegar fueron sus padres, que se casaron en secreto y que Sam y Bran han descubierto la verdad. Si tiene razón, es tu sobrino y el hijo legítimo de Rhaegar. El hombre al que amas tiene una reclamación que podría preceder a la tuya. Cuestionas las pruebas, intentando comprender qué significa para vosotros mientras se aproxima la batalla."
 atfw_daenerys_pov.0010.a: "Entonces debemos hablar de lo que significa."
