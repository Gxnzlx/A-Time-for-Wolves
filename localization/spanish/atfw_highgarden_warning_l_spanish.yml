l_spanish:
 atfw_highgarden.0010.t:0 "Leones en el Camino de las Rosas"
 atfw_highgarden.0010.desc:0 "Mis exploradores traen noticias de un ejército que marcha hacia Altojardín. Jaime Lannister lo encabeza y Randyll Tarly avanza a su lado. Los estandartes que antes defendían el Dominio se vuelven ahora contra él.\n\nLlegarán ante nuestras murallas en tres días. Me quedaré y prepararé la defensa, pero no podemos enfrentarnos solos a esta hueste. Un cuervo debe llegar a Rocadragón. Daenerys debe saber adónde se dirigen los leones."
 atfw_highgarden.0010.a:0 "Defenderé Altojardín. Enviad un cuervo a Daenerys."
 atfw_highgarden.0011.t:0 "Un cuervo del Dominio"
 atfw_highgarden.0011.desc:0 "Tyrion me entrega una carta de Altojardín. Los exploradores de Olenna han avistado al ejército Lannister, acompañado por Randyll Tarly. Ella se dispone a defender el castillo y solicita ayuda antes de que el enemigo lo rodee.\n\nMi Mano contempla el mensaje. Su hermano ha marchado al sur, dejándonos atacar Roca Casterly mientras el Dominio queda expuesto.\n\nNo permaneceré en Rocadragón mientras destruyen a mis aliados. Debemos preparar la partida. Si Jaime toma Altojardín, todavía tendrá que sacar por el camino a sus soldados y todo cuanto hayan robado."
 atfw_highgarden.0011.a:0 "Preparad a los dothraki. Partiré con Drogon."
