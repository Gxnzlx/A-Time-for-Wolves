l_spanish:
 atfw_siege_watch.0003.t:0 "Altojardín resiste"
 atfw_siege_watch.0003.desc:0 "La ofensiva contra Altojardín se ha interrumpido. Por ahora, los atacantes no podrán imponer su victoria y Olenna conserva su vida y sus tierras. La guerra aún puede cambiar el destino del Dominio, pero este asedio ha terminado."
 atfw_siege_watch.0003.a:0 "Altojardín sigue en pie."
